name: Lint

on: [ pull_request ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install pre-commit hook
        run: |
          python -m pip install uv
          uv pip install --system pre-commit
          pre-commit install

      - name: Linting
        run: pre-commit run --all-files --show-diff-on-failure

      # These CPU-only suites cover build-target dispatch, DSL contracts and
      # resource packaging with fixture binaries. Do not widen this to the
      # whole tests/python/sgl_kernel_npu directory -- the kernel tests there
      # require real hardware.
      - name: Build-target unit tests
        run: |
          uv pip install --system pytest setuptools wheel packaging
          pytest -q \
            tests/python/sgl_kernel_npu/test_build_targets.py \
            tests/python/sgl_kernel_npu/test_gemma_rmsnorm_provider.py \
            tests/python/sgl_kernel_npu/test_target_provider.py \
            tests/python/sgl_kernel_npu/test_dsv41_cannbot_dsl_api.py \
            tests/python/sgl_kernel_npu/test_dsv41_cannbot_sources.py \
            tests/python/sgl_kernel_npu/test_dsv41_precision_suite_layout.py \
            tests/unit/test_cannbotdsl_runtime.py \
            tests/unit/test_cannbotdsl_packaging.py \
            tests/unit/test_cannbotdsl_ci.py
