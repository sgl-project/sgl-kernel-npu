name: Lint

on: [ pull_request ]

jobs:
  deepep-loader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test DeepEP shared-library selection without an NPU
        run: python3 tests/python/deepep/test_op_api_loader.py -v
      - name: Test FuseEP diagnostic source selection and reporting without an NPU
        run: python3 tests/python/deepep/test_fuseep_diagnostic.py -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install pre-commit hook
        run: |
          python -m pip install uv
          uv pip install --system pre-commit
          pre-commit install

      - name: Linting
        run: pre-commit run --all-files --show-diff-on-failure
