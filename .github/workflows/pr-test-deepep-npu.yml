      GITHUB_PROXY_URL: "https://gh-proxy.test.osinfra.cn/"
      UV_INDEX_URL: http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple
    steps:
      - name: Clean git config
        run: |
          CONFIG_KEY='http.https://gh-proxy.test.osinfra.cn/.extraheader'
          git config --global --unset "$CONFIG_KEY" || true
      - name: Clean workspace
        run: |
          sudo rm -rf --one-file-system "$GITHUB_WORKSPACE"/* "$GITHUB_WORKSPACE"/.* 2>/dev/null || true
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: true
          submodules: recursive
      - name: Install dependencies
        # lmsysorg cann9.2.0-a3 image ships torch/torch_npu (py3.12), so only build
        # tools and python test deps are installed here
        run: |
          CACHING_URL="cache-service.nginx-pypi-cache.svc.cluster.local"
          sed -Ei "s@(ports|archive).ubuntu.com@${CACHING_URL}:8081@g" /etc/apt/sources.list
          pip config set global.index-url http://${CACHING_URL}/pypi/simple
          pip config set global.trusted-host ${CACHING_URL}
          apt update -y && apt install -y build-essential cmake ccache ninja-build
          python3 -m pip install --no-cache-dir ninja pybind11 pyyaml decorator scipy attrs psutil
      - name: Prepare Deepep
        run: |
          rm -f ${GITHUB_WORKSPACE}/output/deep_ep*.whl
          bash scripts/prepare_deepep_in_container.sh -a deepep
      - name: Run A5 MegaMoe SR A3-side cases (TC_A5MEGAMOE_002 neg4/neg5)
        if: always()
        timeout-minutes: 120
        # NOTE: do NOT set DEEP_USE_MODE here - it is not a valid StrategyMap key and
        # breaks Buffer creation ("Unsupported mode combination", run 42013145469);
        # test_mega_moe.py manages the fused strategy itself.
        run: |
          RESULT_FILE=${GITHUB_WORKSPACE}/a3_megamoe_neg_results.txt
          : > ${RESULT_FILE}
          run_case() {
            local name="$1"; shift
            echo "===== CASE: $name ====="
            if timeout 1800 "$@"; then
              echo "PASS  $name" >> ${RESULT_FILE}
            else
              rc=$?
              if [ "$rc" -eq 124 ]; then echo "FAIL  $name (timeout/hang)" >> ${RESULT_FILE}; else echo "FAIL  $name (exit=$rc)" >> ${RESULT_FILE}; fi
            fi
          }
          run_expect_fail() {
            local name="$1"; shift
            echo "===== NEGATIVE CASE: $name (must be rejected) ====="
            if timeout 1800 "$@"; then
              echo "FAIL  $name (unexpectedly accepted, exit=0)" >> ${RESULT_FILE}
            else
              rc=$?
              if [ "$rc" -eq 124 ]; then echo "FAIL  $name (timeout/hang)" >> ${RESULT_FILE}; else echo "PASS  $name (expectedly rejected, exit=$rc)" >> ${RESULT_FILE}; fi
            fi
          }
          SCRIPT=${GITHUB_WORKSPACE}/tests/python/deepep/test_mega_moe.py
          # neg5: A3 existing w4a8 behavior regression (script w4a8 threshold 1e-4 already meets SR)
          run_case megamoe_tc002_neg5_a3_w4a8_regression python3 ${SCRIPT} --num-processes 16 --quant-mode w4a8
          # neg4: A3 + MXFP must be rejected by CANN mega_moe platform validation
          run_expect_fail megamoe_tc002_neg4_a3_mxfp8_rejected python3 ${SCRIPT} --num-processes 16 --quant-mode mx_fp8_e4m3
          echo "================ A3 MegaMoe A5-SR CASE SUMMARY ================"
          cat ${RESULT_FILE}
          if grep -q "^FAIL" ${RESULT_FILE}; then
            echo "Some A3 MegaMoe A5-SR cases FAILED"
            exit 1
          fi
          echo "All A3 MegaMoe A5-SR cases passed"
      - name: Run A5 alltoall platform negatives on A3 (TC_A5ALLTOALL_002 config6)
        if: always()
        timeout-minutes: 30
        run: |
          RESULT_FILE=${GITHUB_WORKSPACE}/a3_alltoall_plat_results.txt
          : > ${RESULT_FILE}
          run_expect_fail() {
