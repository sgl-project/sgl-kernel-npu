        # - cache miss: clear stale wheels + build + install
        run: |
          if [ "${{ steps.cache-build.outputs.cache-hit }}" = "true" ]; then
            echo "Cache hit, installing cached wheel only"
            bash scripts/prepare_deepep_in_container.sh -s
          else
            echo "Cache miss, building and installing"
            rm -f ${GITHUB_WORKSPACE}/output/deep_ep*.whl
            bash scripts/prepare_deepep_in_container.sh -a deepep Ascend950
          fi
      # Keep this step BEFORE the 1e-4 threshold alignment on purpose: the alltoall
      # SR acceptance values ARE the stock utils.DIFF_THRESHOLDS Dice thresholds
      # (mxfp8 < 2e-3, mxfp4 < 4e-2), so the sed must not be active here.
      - name: Run A5 alltoall MX quant matrix (TC_A5ALLTOALL_001/002, 2 processes)
        if: always()
        timeout-minutes: 60
        run: |
          RESULT_FILE=${GITHUB_WORKSPACE}/a5_alltoall_results.txt
          : > ${RESULT_FILE}
          run_case() {
            local name="$1"; shift
            echo "===== CASE: $name ====="
            if timeout 1800 "$@"; then
              echo "PASS  $name" >> ${RESULT_FILE}
            else
              rc=$?
              if [ "$rc" -eq 124 ]; then echo "FAIL  $name (timeout/hang)" >> ${RESULT_FILE}; else echo "FAIL  $name (exit=$rc)" >> ${RESULT_FILE}; fi
            fi
          }
          DIR=${GITHUB_WORKSPACE}/tests/python/deepep
          # TC_A5ALLTOALL_001: normal/lowlatency x mxfp8/mxfp4 2x2 full matrix
          run_case a5alltoall_tc001_normal_mxfp8 python3 ${DIR}/test_normal_alltoall.py --num-processes 2 --use-mxfp8
          run_case a5alltoall_tc001_normal_mxfp4 python3 ${DIR}/test_normal_alltoall.py --num-processes 2 --use-mxfp4
          run_case a5alltoall_tc001_ll_mxfp8     python3 ${DIR}/test_ll_alltoall.py --num-processes 2 --use-mxfp8
          run_case a5alltoall_tc001_ll_mxfp4     python3 ${DIR}/test_ll_alltoall.py --num-processes 2 --use-mxfp4
          # TC_A5ALLTOALL_002: no-quant bf16 regression (configs 1/2)
          run_case a5alltoall_tc002_normal_bf16  python3 ${DIR}/test_normal_alltoall.py --num-processes 2
          run_case a5alltoall_tc002_ll_bf16      python3 ${DIR}/test_ll_alltoall.py --num-processes 2
          echo "================ A5 alltoall CASE SUMMARY ================"
          cat ${RESULT_FILE}
          if grep -q "^FAIL" ${RESULT_FILE}; then
            echo "Some A5 alltoall SR cases FAILED"
            exit 1
          fi
          echo "All A5 alltoall SR cases passed"
      - name: Align A5 fused-moe accuracy thresholds with SR acceptance (1e-4)
        # Only the fused-moe steps below run under the SR-aligned thresholds;
        # the alltoall step above already finished with stock (= SR) Dice values.
        run: |
          sed -i 's/"fp8": 2e-3,/"fp8": 1e-4,/; s/"fp4": 4e-2,/"fp4": 1e-4,/' ${GITHUB_WORKSPACE}/tests/python/deepep/utils.py
          grep -n -A5 "DIFF_THRESHOLDS = {" ${GITHUB_WORKSPACE}/tests/python/deepep/utils.py
      - name: Run A5 SiTU activation cases (TC_A5SITU_001 configs 2-4, 4 processes)
        if: always()
        timeout-minutes: 90
        run: |
          RESULT_FILE=${GITHUB_WORKSPACE}/a5_situ_results.txt
          : > ${RESULT_FILE}
          run_case() {
            local name="$1"; shift
            echo "===== CASE: $name ====="
            if timeout 1800 "$@"; then
              echo "PASS  $name" >> ${RESULT_FILE}
            else
              rc=$?
              if [ "$rc" -eq 124 ]; then echo "FAIL  $name (timeout/hang)" >> ${RESULT_FILE}; else echo "FAIL  $name (exit=$rc)" >> ${RESULT_FILE}; fi
            fi
          }
          SCRIPT=${GITHUB_WORKSPACE}/tests/python/deepep/test_fused_deep_moe_a5.py
          # TC_A5SITU_001 config2: situ x fp4_e2m1 on the 4-card topology as designed
          run_case a5situ_tc001_cfg2_situ_fp4             python3 ${SCRIPT} --num-processes 4 --activation situ --num-warmups 5 --num-tests 30 --quant fp4_e2m1
          # config3: custom saturation params beta=2.0 / linear-beta=16.0
          run_case a5situ_tc001_cfg3_situ_fp4_custom_beta python3 ${SCRIPT} --num-processes 4 --activation situ --num-warmups 5 --num-tests 30 --quant fp4_e2m1 --beta 2.0 --linear-beta 16.0
          # config4: linear_beta=None, up-branch pass-through
          run_case a5situ_tc001_cfg4_situ_fp4_nolinear    python3 ${SCRIPT} --num-processes 4 --activation situ --num-warmups 5 --num-tests 30 --quant fp4_e2m1 --no-linear-beta
          echo "================ A5 SiTU CASE SUMMARY ================"
          cat ${RESULT_FILE}
          if grep -q "^FAIL" ${RESULT_FILE}; then
            echo "Some A5 SiTU SR cases FAILED"
            exit 1
          fi
          echo "All A5 SiTU SR cases passed"
      - name: Run A5 FP4 w4a4 semantics and negative guards (TC_A5FP4_002, TC_A5MEGAMOE_002 neg3)
        if: always()
        timeout-minutes: 60
        run: |
          RESULT_FILE=${GITHUB_WORKSPACE}/a5_fp4_neg_results.txt
          : > ${RESULT_FILE}
          run_case() {
            local name="$1"; shift
            echo "===== CASE: $name ====="
            if timeout 1800 "$@"; then
              echo "PASS  $name" >> ${RESULT_FILE}
            else
              rc=$?
              if [ "$rc" -eq 124 ]; then echo "FAIL  $name (timeout/hang)" >> ${RESULT_FILE}; else echo "FAIL  $name (exit=$rc)" >> ${RESULT_FILE}; fi
            fi
          }
          run_expect_fail() {
            local name="$1"; shift
            echo "===== NEGATIVE CASE: $name (must be rejected) ====="
            if timeout 1800 "$@"; then
              echo "FAIL  $name (unexpectedly accepted, exit=0)" >> ${RESULT_FILE}
            else
              rc=$?
              if [ "$rc" -eq 124 ]; then echo "FAIL  $name (timeout/hang)" >> ${RESULT_FILE}; else echo "PASS  $name (expectedly rejected, exit=$rc)" >> ${RESULT_FILE}; fi
            fi
          }
          SCRIPT=${GITHUB_WORKSPACE}/tests/python/deepep/test_fused_deep_moe_a5.py
          # TC_A5FP4_002 config3: w4a4 semantics - log quant dtypes of baseline vs fused path
          run_case a5fp4_tc002_w4a4_semantics python3 ${SCRIPT} --num-processes 4 --activation situ --num-warmups 5 --num-tests 30 --quant fp4_e2m1 --log-quant-dtypes
          # TC_A5FP4_002 config2 verbatim: bs=257 over boundary, parser rejects before any process spawns
          run_expect_fail a5fp4_tc002_bs257_rejected python3 ${SCRIPT} --num-processes 8 --num-tokens 257
          # TC_A5MEGAMOE_002 neg3 CLI form: unknown quant_mode rejected by argparse, process never launched
          run_expect_fail megamoe_tc002_neg3_cli_unknown_quant python3 ${GITHUB_WORKSPACE}/tests/python/deepep/test_mega_moe.py --num-processes 8 --quant-mode fp8_x
          echo "================ A5 FP4/NEG CASE SUMMARY ================"
          cat ${RESULT_FILE}
          if grep -q "^FAIL" ${RESULT_FILE}; then
            echo "Some A5 FP4/negative SR cases FAILED"
            exit 1
          fi
          echo "All A5 FP4/negative SR cases passed"

  test-a3-megamoe-a5sr-negatives:
    name: A5 MegaMoe SR - A3-side negative and regression (8 proc, CANN 9.2.0)
    needs: get-changed-files
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'workflow_call' || (
        (github.repository == 'sgl-project/sgl-kernel-npu' || github.event_name == 'pull_request') &&
        github.event.pull_request.draft == false &&
        (needs.get-changed-files.outputs.ops_changed == 'true' || needs.get-changed-files.outputs.common_changed == 'true')
      )
    runs-on: linux-aarch64-a3-800t-16
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/dockerhub/lmsysorg/sglang:20261022-cann9.2.0-a3
    env:
      TORCH_CACHE_URL: "http://cache-service.nginx-pypi-cache.svc.cluster.local/whl/cpu"
      PYPI_CACHE_URL: "http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple"
      GITHUB_PROXY_URL: "https://gh-proxy.test.osinfra.cn/"
      UV_INDEX_URL: http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple
    steps:
      - name: Clean git config
        run: |
          CONFIG_KEY='http.https://gh-proxy.test.osinfra.cn/.extraheader'
          git config --global --unset "$CONFIG_KEY" || true
      - name: Clean workspace
        run: |
          sudo rm -rf --one-file-system "$GITHUB_WORKSPACE"/* "$GITHUB_WORKSPACE"/.* 2>/dev/null || true
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: true
          submodules: recursive
      - name: Install dependencies
        # lmsysorg cann9.2.0-a3 image ships torch/torch_npu (py3.12), so only build
        # tools and python test deps are installed here
        run: |
          CACHING_URL="cache-service.nginx-pypi-cache.svc.cluster.local"
          sed -Ei "s@(ports|archive).ubuntu.com@${CACHING_URL}:8081@g" /etc/apt/sources.list
          pip config set global.index-url http://${CACHING_URL}/pypi/simple
          pip config set global.trusted-host ${CACHING_URL}
          apt update -y && apt install -y build-essential cmake ccache ninja-build
          python3 -m pip install --no-cache-dir ninja pybind11 pyyaml decorator scipy attrs psutil
      - name: Prepare Deepep
        run: |
          rm -f ${GITHUB_WORKSPACE}/output/deep_ep*.whl
          bash scripts/prepare_deepep_in_container.sh -a deepep
      - name: Run A5 MegaMoe SR A3-side cases (TC_A5MEGAMOE_002 neg5/neg6)
        if: always()
        timeout-minutes: 120
        env:
          DEEP_USE_MODE: MEGA_MOE
        run: |
          RESULT_FILE=${GITHUB_WORKSPACE}/a3_megamoe_neg_results.txt
          : > ${RESULT_FILE}
          run_case() {
            local name="$1"; shift
            echo "===== CASE: $name ====="
            if timeout 1800 "$@"; then
              echo "PASS  $name" >> ${RESULT_FILE}
            else
              rc=$?
              if [ "$rc" -eq 124 ]; then echo "FAIL  $name (timeout/hang)" >> ${RESULT_FILE}; else echo "FAIL  $name (exit=$rc)" >> ${RESULT_FILE}; fi
            fi
          }
          run_expect_fail() {
            local name="$1"; shift
            echo "===== NEGATIVE CASE: $name (must be rejected) ====="
            if timeout 1800 "$@"; then
              echo "FAIL  $name (unexpectedly accepted, exit=0)" >> ${RESULT_FILE}
            else
              rc=$?
              if [ "$rc" -eq 124 ]; then echo "FAIL  $name (timeout/hang)" >> ${RESULT_FILE}; else echo "PASS  $name (expectedly rejected, exit=$rc)" >> ${RESULT_FILE}; fi
            fi
          }
          SCRIPT=${GITHUB_WORKSPACE}/tests/python/deepep/test_mega_moe.py
          # num-tokens 1024 / hccl-buffsize 4096 come from TC_A5MEGAMOE common params;
          # neg6: A3 existing w4a8 behavior regression (script w4a8 threshold 1e-4 already meets SR)
          run_case megamoe_tc002_neg6_a3_w4a8_regression python3 ${SCRIPT} --num-processes 8 --num-tokens 1024 --quant-mode w4a8 --hccl-buffsize 4096
          # neg5: A3 + MXFP must be rejected by CANN mega_moe platform validation
          run_expect_fail megamoe_tc002_neg5_a3_mxfp8_rejected python3 ${SCRIPT} --num-processes 8 --num-tokens 1024 --quant-mode mx_fp8_e4m3 --hccl-buffsize 4096
          echo "================ A3 MegaMoe A5-SR CASE SUMMARY ================"
          cat ${RESULT_FILE}
          if grep -q "^FAIL" ${RESULT_FILE}; then
            echo "Some A3 MegaMoe A5-SR cases FAILED"
            exit 1
          fi
          echo "All A3 MegaMoe A5-SR cases passed"

  finish:
    if: always()
    needs:
      - test-all-build-core
      - test-all-build-moe
      - test-build-deepep-a2
      - test-deepep-a5
      - test-a5-sr4-mxfp-cases
      - test-a3-megamoe-a5sr-negatives
    runs-on: ubuntu-latest
    steps:
      - name: Check all dependent job statuses
        run: |
          results=(${{ join(needs.*.result, ' ') }})
          for result in "${results[@]}"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "Job failed with result: $result"
              exit 1
            fi
          done
          echo "All jobs completed successfully"
          exit 0
