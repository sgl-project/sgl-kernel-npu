      - name: Clean workspace
        run: |
          sudo rm -rf --one-file-system "$GITHUB_WORKSPACE"/* "$GITHUB_WORKSPACE"/.* 2>/dev/null || true
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: true
          submodules: recursive
      - name: Install dependencies
        # lmsysorg cann9.2.0-950-amd64 image ships torch/torch_npu (py3.12); only build
        # tools and python test deps are installed here (MegaMoe backend cann_ops_transformer needs CANN 9.2)
        run: |
          CACHING_URL="cache-service.nginx-pypi-cache.svc.cluster.local"
          sed -Ei "s@(ports|archive).ubuntu.com@${CACHING_URL}:8081@g" /etc/apt/sources.list
          pip config set global.index-url http://${CACHING_URL}/pypi/simple
          pip config set global.trusted-host ${CACHING_URL}
          apt update -y && apt install -y build-essential cmake ccache ninja-build
          python3 -m pip install --no-cache-dir ninja pybind11 pyyaml decorator scipy attrs psutil
      - name: Prepare Deepep
        run: |
          rm -f ${GITHUB_WORKSPACE}/output/deep_ep*.whl
          bash scripts/prepare_deepep_in_container.sh -a deepep Ascend950
      - name: Run A5 MegaMoe SR A5-side negatives (TC_A5MEGAMOE_002 neg1/2/3)
        if: always()
        timeout-minutes: 90
        # NOTE: do NOT set DEEP_USE_MODE here. test_mega_moe.py manages the fused
        # strategy itself; forcing the env breaks Buffer creation with
        # "ValueError: Unsupported mode combination: DEEP_USE_MODE=mega_moe"
        # (ep_strategy.py:85, run 42013145469).
        run: |
          RESULT_FILE=${GITHUB_WORKSPACE}/a5_megamoe_neg_results.txt
          : > ${RESULT_FILE}
          run_expect_fail() {
            local name="$1"; shift
            echo "===== NEGATIVE CASE: $name (must be rejected) ====="
            if timeout 1800 "$@"; then
              echo "FAIL  $name (unexpectedly accepted, exit=0)" >> ${RESULT_FILE}
            else
              rc=$?
              if [ "$rc" -eq 124 ]; then echo "FAIL  $name (timeout/hang)" >> ${RESULT_FILE}; else echo "PASS  $name (expectedly rejected, exit=$rc)" >> ${RESULT_FILE}; fi
            fi
          }
          SCRIPT=${GITHUB_WORKSPACE}/tests/python/deepep/test_mega_moe.py
          # neg3 first on the STOCK script: unknown quant_mode rejected by argparse, process never launched
          run_expect_fail megamoe_tc002_neg3_cli_unknown_quant_rejected python3 ${SCRIPT} --num-processes 4 --quant-mode fp8_x
          # neg1/neg2 need the SR-design temp patch (pre-condition 6): comment out the --quant-mode
          # choices line so "int8"/"bf16" reach _resolve and the CANN mega_moe platform check.
          # CI-only patch, restored via git checkout right after - must never be committed.
          sed -i 's/^\([[:space:]]*\)choices=SUPPORTED_QUANT_MODES,[[:space:]]*$/\1# choices=SUPPORTED_QUANT_MODES  # TEMP-PATCH CI SR negative (design precondition-6), restored below/' ${SCRIPT}
          grep -n "TEMP-PATCH" ${SCRIPT}
          # neg1: A5 + int8 must be rejected by CANN mega_moe platform validation
          run_expect_fail megamoe_tc002_neg1_a5_int8_rejected python3 ${SCRIPT} --num-processes 4 --num-tokens 1024 --quant-mode int8 --hccl-buffsize 4096
          # neg2: A5 + "bf16" must be rejected by CANN mega_moe platform validation
          run_expect_fail megamoe_tc002_neg2_a5_bf16_rejected python3 ${SCRIPT} --num-processes 4 --num-tokens 1024 --quant-mode bf16 --hccl-buffsize 4096
          # container git needs safe.directory before touching the worktree (dubious
          # ownership killed the restore with exit 128 in run 42013145469)
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
          git checkout -- tests/python/deepep/test_mega_moe.py
          if git diff --quiet -- tests/python/deepep/test_mega_moe.py; then
            echo "TEMP-PATCH restored OK"
          else
            echo "WARN: test_mega_moe.py still patched"; git diff -- tests/python/deepep/test_mega_moe.py | head -20
          fi
          echo "================ A5 MegaMoe A5-SR NEG CASE SUMMARY ================"
          cat ${RESULT_FILE}
          if grep -q "^FAIL" ${RESULT_FILE}; then
            echo "Some A5 MegaMoe A5-SR negative cases FAILED"
            exit 1
          fi
          echo "All A5 MegaMoe A5-SR negative cases passed"

