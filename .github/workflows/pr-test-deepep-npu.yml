              echo "FAIL  $name (unexpectedly accepted, exit=0)" >> ${RESULT_FILE}
            else
              rc=$?
              if [ "$rc" -eq 124 ]; then echo "FAIL  $name (timeout/hang)" >> ${RESULT_FILE}; else echo "PASS  $name (expectedly rejected, exit=$rc)" >> ${RESULT_FILE}; fi
            fi
          }
          DIR=${GITHUB_WORKSPACE}/tests/python/deepep
          # config6: mxfp8/mxfp4 flags are A5-only; on A3 the script platform check must reject
          run_expect_fail a5alltoall_tc002_cfg6_a3_mxfp8_normal_rejected python3 ${DIR}/test_normal_alltoall.py --num-processes 2 --use-mxfp8
          run_expect_fail a5alltoall_tc002_cfg6_a3_mxfp8_ll_rejected     python3 ${DIR}/test_ll_alltoall.py --num-processes 2 --use-mxfp8
          echo "================ A3 alltoall PLATFORM NEG CASE SUMMARY ================"
          cat ${RESULT_FILE}
          if grep -q "^FAIL" ${RESULT_FILE}; then
            echo "Some A3 alltoall platform negative cases FAILED"
            exit 1
          fi
          echo "All A3 alltoall platform negative cases passed"

