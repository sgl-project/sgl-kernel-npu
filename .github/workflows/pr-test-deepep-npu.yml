name: PR Test for SGL-KERNEL-NPU DeepEP (Ascend NPU)

on:
  pull_request:
    branches: [ main ]
    paths:
      - "build.sh"
      - "cmake/**"
      - "python/deep_ep/deep_ep**"
      - "csrc/deepep**"
      - "tests/python/deepep**"
      - "scripts/**"
      - ".github/workflows/pr-test-deepep-npu.yml"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: pr-test-deepep-npu-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  get-changed-files:
    name: Check changed files
    runs-on: ubuntu-latest
    outputs:
      ops2_changed: ${{ steps.match-groups.outputs.ops2_any_changed }}
      ops_changed: ${{ steps.match-groups.outputs.ops_any_changed }}
      common_changed: ${{ steps.match-groups.outputs.common_any_changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Match changed files
        id: match-groups
        uses: tj-actions/changed-files@v45
        with:
          files_yaml: |
            ops:
              - csrc/deepep/ops/**
            ops2:
              - csrc/deepep/ops2/**
            common:
              - csrc/**
              - '!csrc/deepep/ops/**'
              - '!csrc/deepep/ops2/**'
              - build.sh
              - cmake/**
              - python/**
              - tests/**
              - scripts/**
              - .github/workflows/pr-test-deepep-npu.yml

  test-all-build-core:
    needs: get-changed-files
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'workflow_call' || (
        (github.repository == 'sgl-project/sgl-kernel-npu' || github.event_name == 'pull_request') &&
        github.event.pull_request.draft == false &&
        (needs.get-changed-files.outputs.ops_changed == 'true' || needs.get-changed-files.outputs.common_changed == 'true')
      )
    runs-on: linux-aarch64-a3-800t-16
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann:${{ matrix.cann_version }}-a3-ubuntu22.04-py3.12
    env:
      GITHUB_PROXY_URL: "https://gh-proxy.test.osinfra.cn/"
    strategy:
      matrix:
        cann_version: [9.1.0, 9.2.0]
    steps:
      - name: Clean git config
        run: |
          CONFIG_KEY='http.https://gh-proxy.test.osinfra.cn/.extraheader'
          git config --global --unset "$CONFIG_KEY" || true
      - name: Clean workspace
        run: |
          sudo rm -rf --one-file-system "$GITHUB_WORKSPACE"/* "$GITHUB_WORKSPACE"/.* 2>/dev/null || true
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: true
          submodules: recursive
      - name: Get build hash
        id: get_build_hash
        run: |
          BUILD_HASH=$(find ./csrc ./cmake ./python ./build.sh ./CMakeLists.txt ./scripts/prepare_deepep_in_container.sh ./scripts/npu_ci_install_dependency.sh \
            -type f -not -path '*/.*' 2>/dev/null | sort | xargs sha256sum | sha256sum | awk '{print $1}')
          echo "BUILD_HASH=$BUILD_HASH" >> $GITHUB_OUTPUT
          CANN_RAW=$(cat /usr/local/Ascend/ascend-toolkit/latest/version.cfg 2>/dev/null || echo "unknown")
          CANN_VERSION=$(echo "$CANN_RAW" | tr -cd '[:alnum:].-' | head -c 32)
          [ -z "$CANN_VERSION" ] && CANN_VERSION="unknown"
          echo "CANN_VERSION=$CANN_VERSION" >> $GITHUB_OUTPUT
      - name: Restore build cache
        id: cache-build
        uses: runs-on/cache@v4
        with:
          path: output
          key: sgl-kernel-npu-build-v4-${{ runner.os }}-a3-cann${{ matrix.cann_version }}-py3.12-${{ steps.get_build_hash.outputs.BUILD_HASH }}
      - name: Install dependencies
        run: |
          pip install uv
          bash scripts/npu_ci_install_dependency.sh --cann-version ${{ matrix.cann_version }}
      - name: Prepare Deepep
        # - cache hit: install cached wheel only (skip build via -s flag)
        # - cache miss: clear stale wheels + build + install
        run: |
          if [ "${{ steps.cache-build.outputs.cache-hit }}" = "true" ]; then
            echo "Cache hit, installing cached wheel only"
            bash scripts/prepare_deepep_in_container.sh -s
          else
            echo "Cache miss, building and installing"
            rm -f ${GITHUB_WORKSPACE}/output/deep_ep*.whl
            bash scripts/prepare_deepep_in_container.sh
          fi
      - name: Legacy deepep test steps trimmed for this SR CI branch
        run: echo "Legacy Run-test steps removed on branch sr4-cases-ci-deepep; full matrix is preserved in git history (commit e76950c)."

  test-all-build-moe:
    needs: get-changed-files
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'workflow_call' || (
        (github.repository == 'sgl-project/sgl-kernel-npu' || github.event_name == 'pull_request') &&
        github.event.pull_request.draft == false &&
        (needs.get-changed-files.outputs.ops_changed == 'true' || needs.get-changed-files.outputs.common_changed == 'true')
      )
    runs-on: linux-aarch64-a3-800t-16
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann:${{ matrix.cann_version }}-a3-ubuntu22.04-py3.12
    env:
      GITHUB_PROXY_URL: "https://gh-proxy.test.osinfra.cn/"
    strategy:
      matrix:
        cann_version: [9.1.0, 9.2.0]
    steps:
      - name: Clean git config
        run: |
          CONFIG_KEY='http.https://gh-proxy.test.osinfra.cn/.extraheader'
          git config --global --unset "$CONFIG_KEY" || true
      - name: Clean workspace
        run: |
          sudo rm -rf --one-file-system "$GITHUB_WORKSPACE"/* "$GITHUB_WORKSPACE"/.* 2>/dev/null || true
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: true
          submodules: recursive
      - name: Get build hash
        id: get_build_hash
        run: |
          BUILD_HASH=$(find ./csrc ./cmake ./python ./build.sh ./CMakeLists.txt ./scripts/prepare_deepep_in_container.sh ./scripts/npu_ci_install_dependency.sh \
            -type f -not -path '*/.*' 2>/dev/null | sort | xargs sha256sum | sha256sum | awk '{print $1}')
          echo "BUILD_HASH=$BUILD_HASH" >> $GITHUB_OUTPUT
          CANN_RAW=$(cat /usr/local/Ascend/ascend-toolkit/latest/version.cfg 2>/dev/null || echo "unknown")
          CANN_VERSION=$(echo "$CANN_RAW" | tr -cd '[:alnum:].-' | head -c 32)
          [ -z "$CANN_VERSION" ] && CANN_VERSION="unknown"
          echo "CANN_VERSION=$CANN_VERSION" >> $GITHUB_OUTPUT
      - name: Restore build cache
        id: cache-build
        uses: runs-on/cache@v4
        with:
          path: output
          key: sgl-kernel-npu-build-v4-${{ runner.os }}-a3-cann${{ matrix.cann_version }}-py3.12-${{ steps.get_build_hash.outputs.BUILD_HASH }}
      - name: Install dependencies
        run: |
          pip install uv
          bash scripts/npu_ci_install_dependency.sh --cann-version ${{ matrix.cann_version }}
      - name: Prepare Deepep
        # - cache hit: install cached wheel only (skip build via -s flag)
        # - cache miss: clear stale wheels + build + install
        run: |
          if [ "${{ steps.cache-build.outputs.cache-hit }}" = "true" ]; then
            echo "Cache hit, installing cached wheel only"
            bash scripts/prepare_deepep_in_container.sh -s
          else
            echo "Cache miss, building and installing"
            rm -f ${GITHUB_WORKSPACE}/output/deep_ep*.whl
            bash scripts/prepare_deepep_in_container.sh
          fi
      - name: Legacy deepep test steps trimmed for this SR CI branch
        run: echo "Legacy Run-test steps removed on branch sr4-cases-ci-deepep; full matrix is preserved in git history (commit e76950c)."

  test-build-deepep-a2:
    needs: get-changed-files
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'workflow_call' || (
        (github.repository == 'sgl-project/sgl-kernel-npu' || github.event_name == 'pull_request') &&
        github.event.pull_request.draft == false &&
        needs.get-changed-files.outputs.ops2_changed == 'true'
      )
    runs-on: linux-aarch64-a2-8
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann:${{ matrix.cann_version }}-910b-ubuntu22.04-py3.12
    env:
      GITHUB_PROXY_URL: "https://gh-proxy.test.osinfra.cn/"
    strategy:
      matrix:
        cann_version: [9.1.0, 9.2.0]
    steps:
      - name: Clean git config
        run: |
          CONFIG_KEY='http.https://gh-proxy.test.osinfra.cn/.extraheader'
          git config --global --unset "$CONFIG_KEY" || true
      - name: Clean workspace
        run: |
          sudo rm -rf --one-file-system "$GITHUB_WORKSPACE"/* "$GITHUB_WORKSPACE"/.* 2>/dev/null || true
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: true
          submodules: recursive
      - name: Get build hash
        id: get_build_hash
        run: |
          BUILD_HASH=$(find ./csrc ./cmake ./python ./build.sh ./CMakeLists.txt ./scripts/prepare_deepep_in_container.sh ./scripts/npu_ci_install_dependency.sh \
            -type f -not -path '*/.*' 2>/dev/null | sort | xargs sha256sum | sha256sum | awk '{print $1}')
          echo "BUILD_HASH=$BUILD_HASH" >> $GITHUB_OUTPUT
          CANN_RAW=$(cat /usr/local/Ascend/ascend-toolkit/latest/version.cfg 2>/dev/null || echo "unknown")
          CANN_VERSION=$(echo "$CANN_RAW" | tr -cd '[:alnum:].-' | head -c 32)
          [ -z "$CANN_VERSION" ] && CANN_VERSION="unknown"
          echo "CANN_VERSION=$CANN_VERSION" >> $GITHUB_OUTPUT
      - name: Restore build cache
        id: cache-build
        uses: runs-on/cache@v4
        with:
          path: output
          key: sgl-kernel-npu-build-v4-${{ runner.os }}-a2-cann${{ matrix.cann_version }}-py3.12-${{ steps.get_build_hash.outputs.BUILD_HASH }}

      - name: Install dependencies
        run: |
          pip install uv
          bash scripts/npu_ci_install_dependency.sh --cann-version ${{ matrix.cann_version }}
      - name: Prepare Deepep
        # - cache hit: install cached wheel only (skip build via -s flag)
        # - cache miss: clear stale wheels + build (-a deepep2) + install
        run: |
          if [ "${{ steps.cache-build.outputs.cache-hit }}" = "true" ]; then
            echo "Cache hit, installing cached wheel only"
            bash scripts/prepare_deepep_in_container.sh -s
          else
            echo "Cache miss, building and installing"
            rm -f ${GITHUB_WORKSPACE}/output/deep_ep*.whl
            bash scripts/prepare_deepep_in_container.sh -a deepep2
          fi
      - name: Legacy deepep test steps trimmed for this SR CI branch
        run: echo "Legacy Run-test steps removed on branch sr4-cases-ci-deepep; full matrix is preserved in git history (commit e76950c)."

  test-deepep-a5:
    needs: get-changed-files
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'workflow_call' || (
        (github.repository == 'sgl-project/sgl-kernel-npu' || github.event_name == 'pull_request') &&
        github.event.pull_request.draft == false &&
        (needs.get-changed-files.outputs.ops_changed == 'true' || needs.get-changed-files.outputs.common_changed == 'true')
      )
    runs-on: linux-amd64-a5-4
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann:${{ matrix.cann_version }}-950-ubuntu22.04-py3.12
    env:
      GITHUB_PROXY_URL: "https://gh-proxy.test.osinfra.cn/"
    strategy:
      matrix:
        cann_version: [9.1.0]
    steps:
      - name: Clean git config
        run: |
          CONFIG_KEY='http.https://gh-proxy.test.osinfra.cn/.extraheader'
          git config --global --unset "$CONFIG_KEY" || true
      - name: Clean workspace
        run: |
          sudo rm -rf --one-file-system "$GITHUB_WORKSPACE"/* "$GITHUB_WORKSPACE"/.* 2>/dev/null || true
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: true
          submodules: recursive
      - name: Get build hash
        id: get_build_hash
        run: |
          BUILD_HASH=$(find ./csrc ./cmake ./python ./build.sh ./CMakeLists.txt ./scripts/prepare_deepep_in_container.sh ./scripts/npu_ci_install_dependency.sh \
            -type f -not -path '*/.*' 2>/dev/null | sort | xargs sha256sum | sha256sum | awk '{print $1}')
          echo "BUILD_HASH=$BUILD_HASH" >> $GITHUB_OUTPUT
          CANN_RAW=$(cat /usr/local/Ascend/ascend-toolkit/latest/version.cfg 2>/dev/null || echo "unknown")
          CANN_VERSION=$(echo "$CANN_RAW" | tr -cd '[:alnum:].-' | head -c 32)
          [ -z "$CANN_VERSION" ] && CANN_VERSION="unknown"
          echo "CANN_VERSION=$CANN_VERSION" >> $GITHUB_OUTPUT
      - name: Restore build cache
        id: cache-build
        uses: runs-on/cache@v4
        with:
          path: output
          key: sgl-kernel-npu-build-v4-${{ runner.os }}-a5-cann${{ matrix.cann_version }}-py3.12-${{ steps.get_build_hash.outputs.BUILD_HASH }}
      - name: Install dependencies
        run: |
          pip install uv
          bash scripts/npu_ci_install_dependency.sh --cann-version ${{ matrix.cann_version }}
      - name: Prepare Deepep
        # - cache hit: install cached wheel only (skip build via -s flag)
        # - cache miss: clear stale wheels + build + install
        run: |
          if [ "${{ steps.cache-build.outputs.cache-hit }}" = "true" ]; then
            echo "Cache hit, installing cached wheel only"
            bash scripts/prepare_deepep_in_container.sh -s
          else
            echo "Cache miss, building and installing"
            rm -f ${GITHUB_WORKSPACE}/output/deep_ep*.whl
            bash scripts/prepare_deepep_in_container.sh -a deepep Ascend950
          fi
      - name: Legacy deepep test steps trimmed for this SR CI branch
        run: echo "Legacy Run-test steps removed on branch sr4-cases-ci-deepep; full matrix is preserved in git history (commit e76950c)."

  test-a5-sr4-mxfp-cases:
    name: A5 SR cases - SiTU / FP4 / alltoall mxfp8-mxfp4 (4-card, CANN 9.1.0)
    needs: get-changed-files
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'workflow_call' || (
        (github.repository == 'sgl-project/sgl-kernel-npu' || github.event_name == 'pull_request') &&
        github.event.pull_request.draft == false &&
        (needs.get-changed-files.outputs.ops_changed == 'true' || needs.get-changed-files.outputs.common_changed == 'true')
      )
    runs-on: linux-amd64-a5-4
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann:9.1.0-950-ubuntu22.04-py3.12
    env:
      TORCH_CACHE_URL: "http://cache-service.nginx-pypi-cache.svc.cluster.local/whl/cpu"
      PYPI_CACHE_URL: "http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple"
      GITHUB_PROXY_URL: "https://gh-proxy.test.osinfra.cn/"
      UV_INDEX_URL: http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple
    strategy:
      matrix:
        cann_version: [9.1.0]
    steps:
      - name: Clean git config
        run: |
          CONFIG_KEY='http.https://gh-proxy.test.osinfra.cn/.extraheader'
          git config --global --unset "$CONFIG_KEY" || true
      - name: Clean workspace
        run: |
          sudo rm -rf --one-file-system "$GITHUB_WORKSPACE"/* "$GITHUB_WORKSPACE"/.* 2>/dev/null || true
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: true
          submodules: recursive
      - name: Get build hash
        id: get_build_hash
        run: |
          BUILD_HASH=$(find ./csrc ./cmake ./python ./build.sh ./CMakeLists.txt ./scripts/prepare_deepep_in_container.sh ./scripts/npu_ci_install_dependency.sh \
            -type f -not -path '*/.*' 2>/dev/null | sort | xargs sha256sum | sha256sum | awk '{print $1}')
          echo "BUILD_HASH=$BUILD_HASH" >> $GITHUB_OUTPUT
      - name: Restore build cache
        id: cache-build
        uses: runs-on/cache@v4
        with:
          path: output
          key: sgl-kernel-npu-build-v4-${{ runner.os }}-a5-cann${{ matrix.cann_version }}-py3.12-sr4-${{ steps.get_build_hash.outputs.BUILD_HASH }}
      - name: Install dependencies
        run: |
          pip install uv
          bash scripts/npu_ci_install_dependency.sh --cann-version ${{ matrix.cann_version }}
      - name: Prepare Deepep
        # - cache hit: install cached wheel only (skip build via -s flag)
        # - cache miss: clear stale wheels + build + install
        run: |
          if [ "${{ steps.cache-build.outputs.cache-hit }}" = "true" ]; then
            echo "Cache hit, installing cached wheel only"
            bash scripts/prepare_deepep_in_container.sh -s
          else
            echo "Cache miss, building and installing"
            rm -f ${GITHUB_WORKSPACE}/output/deep_ep*.whl
            bash scripts/prepare_deepep_in_container.sh -a deepep Ascend950
          fi
      # Keep this step BEFORE the 1e-4 threshold alignment on purpose: the alltoall
      # SR acceptance values ARE the stock utils.DIFF_THRESHOLDS Dice thresholds
      # (mxfp8 < 2e-3, mxfp4 < 4e-2), so the sed must not be active here.
      - name: Run A5 alltoall MX quant matrix + guards (TC_A5ALLTOALL_001/002)
        if: always()
        timeout-minutes: 60
        run: |
          RESULT_FILE=${GITHUB_WORKSPACE}/a5_alltoall_results.txt
          : > ${RESULT_FILE}
          run_case() {
            local name="$1"; shift
            echo "===== CASE: $name ====="
            if timeout 1800 "$@"; then
              echo "PASS  $name" >> ${RESULT_FILE}
            else
              rc=$?
              if [ "$rc" -eq 124 ]; then echo "FAIL  $name (timeout/hang)" >> ${RESULT_FILE}; else echo "FAIL  $name (exit=$rc)" >> ${RESULT_FILE}; fi
            fi
          }
          run_expect_fail() {
            local name="$1"; shift
            echo "===== NEGATIVE CASE: $name (must be rejected) ====="
            if timeout 1800 "$@"; then
              echo "FAIL  $name (unexpectedly accepted, exit=0)" >> ${RESULT_FILE}
            else
              rc=$?
              if [ "$rc" -eq 124 ]; then echo "FAIL  $name (timeout/hang)" >> ${RESULT_FILE}; else echo "PASS  $name (expectedly rejected, exit=$rc)" >> ${RESULT_FILE}; fi
            fi
          }
          DIR=${GITHUB_WORKSPACE}/tests/python/deepep
          # TC_A5ALLTOALL_001: normal/lowlatency x mxfp8/mxfp4 2x2 full matrix
          run_case a5alltoall_tc001_normal_mxfp8 python3 ${DIR}/test_normal_alltoall.py --num-processes 2 --use-mxfp8
          run_case a5alltoall_tc001_normal_mxfp4 python3 ${DIR}/test_normal_alltoall.py --num-processes 2 --use-mxfp4
          run_case a5alltoall_tc001_ll_mxfp8     python3 ${DIR}/test_ll_alltoall.py --num-processes 2 --use-mxfp8
          run_case a5alltoall_tc001_ll_mxfp4     python3 ${DIR}/test_ll_alltoall.py --num-processes 2 --use-mxfp4
          # TC_A5ALLTOALL_002 configs1/2: no-quant bf16 regression
          run_case a5alltoall_tc002_cfg1_normal_bf16 python3 ${DIR}/test_normal_alltoall.py --num-processes 2
          run_case a5alltoall_tc002_cfg2_ll_bf16     python3 ${DIR}/test_ll_alltoall.py --num-processes 2
          # TC_A5ALLTOALL_002 config3: format uniqueness via -h (quant flags are exactly the
          # --use-fp8/--use-mxfp8/--use-mxfp4 booleans; no E5M2-family MX option may exist)
          python3 ${DIR}/test_normal_alltoall.py -h > ${GITHUB_WORKSPACE}/normal_a2a_help.txt 2>&1
          python3 ${DIR}/test_ll_alltoall.py -h > ${GITHUB_WORKSPACE}/ll_a2a_help.txt 2>&1
          if grep -q -- "--use-mxfp8" ${GITHUB_WORKSPACE}/normal_a2a_help.txt \
             && grep -q -- "--use-mxfp4" ${GITHUB_WORKSPACE}/normal_a2a_help.txt \
             && grep -q -- "--use-fp8" ${GITHUB_WORKSPACE}/normal_a2a_help.txt \
             && grep -q -- "--use-mxfp8" ${GITHUB_WORKSPACE}/ll_a2a_help.txt \
             && grep -q -- "--use-mxfp4" ${GITHUB_WORKSPACE}/ll_a2a_help.txt \
             && ! grep -qi "e5m2" ${GITHUB_WORKSPACE}/normal_a2a_help.txt \
             && ! grep -qi "e5m2" ${GITHUB_WORKSPACE}/ll_a2a_help.txt; then
            echo "PASS  a5alltoall_tc002_cfg3_format_uniqueness" >> ${RESULT_FILE}
          else
            echo "FAIL  a5alltoall_tc002_cfg3_format_uniqueness (help flag surface mismatch)" >> ${RESULT_FILE}
          fi
          # TC_A5ALLTOALL_002 configs4/5: quant flag mutual exclusion (argparse, process never launched)
          run_expect_fail a5alltoall_tc002_cfg4_mutex_normal python3 ${DIR}/test_normal_alltoall.py --num-processes 2 --use-mxfp8 --use-mxfp4
          run_expect_fail a5alltoall_tc002_cfg5_mutex_ll     python3 ${DIR}/test_ll_alltoall.py --num-processes 2 --use-mxfp8 --use-mxfp4
          echo "================ A5 alltoall CASE SUMMARY ================"
          cat ${RESULT_FILE}
          if grep -q "^FAIL" ${RESULT_FILE}; then
            echo "Some A5 alltoall SR cases FAILED"
            exit 1
          fi
          echo "All A5 alltoall SR cases passed"
      - name: Align A5 fused-moe accuracy thresholds with SR acceptance (1e-4)
        # Only the fused-moe steps below run under the SR-aligned thresholds;
        # the alltoall step above already finished with stock (= SR) Dice values.
        run: |
          sed -i 's/"fp8": 2e-3,/"fp8": 1e-4,/; s/"fp4": 4e-2,/"fp4": 1e-4,/' ${GITHUB_WORKSPACE}/tests/python/deepep/utils.py
          grep -n -A5 "DIFF_THRESHOLDS = {" ${GITHUB_WORKSPACE}/tests/python/deepep/utils.py
      - name: Run A5 SiTU activation cases (TC_A5SITU_001 configs 2-4, 4 processes)
        if: always()
        timeout-minutes: 90
        run: |
          RESULT_FILE=${GITHUB_WORKSPACE}/a5_situ_results.txt
          : > ${RESULT_FILE}
          run_case() {
            local name="$1"; shift
            echo "===== CASE: $name ====="
            if timeout 1800 "$@"; then
              echo "PASS  $name" >> ${RESULT_FILE}
            else
              rc=$?
              if [ "$rc" -eq 124 ]; then echo "FAIL  $name (timeout/hang)" >> ${RESULT_FILE}; else echo "FAIL  $name (exit=$rc)" >> ${RESULT_FILE}; fi
            fi
          }
          SCRIPT=${GITHUB_WORKSPACE}/tests/python/deepep/test_fused_deep_moe_a5.py
          # TC_A5SITU_001 config2: situ x fp4_e2m1 on the 4-card topology as designed
          run_case a5situ_tc001_cfg2_situ_fp4             python3 ${SCRIPT} --num-processes 4 --activation situ --num-warmups 5 --num-tests 30 --quant fp4_e2m1
          # config3: custom saturation params beta=2.0 / linear-beta=16.0
          run_case a5situ_tc001_cfg3_situ_fp4_custom_beta python3 ${SCRIPT} --num-processes 4 --activation situ --num-warmups 5 --num-tests 30 --quant fp4_e2m1 --beta 2.0 --linear-beta 16.0
          # config4: linear_beta=None, up-branch pass-through
          run_case a5situ_tc001_cfg4_situ_fp4_nolinear    python3 ${SCRIPT} --num-processes 4 --activation situ --num-warmups 5 --num-tests 30 --quant fp4_e2m1 --no-linear-beta
          echo "================ A5 SiTU CASE SUMMARY ================"
          cat ${RESULT_FILE}
          if grep -q "^FAIL" ${RESULT_FILE}; then
