        timeout-minutes: 10
        env:
          HCCL_BUFFSIZE: 3000
        run: |
          python3 $GITHUB_WORKSPACE/tests/python/deepep/test_fused_deep_moe.py --num-topk=1
          python3 $GITHUB_WORKSPACE/tests/python/deepep/test_fused_deep_moe.py --num-topk=12
