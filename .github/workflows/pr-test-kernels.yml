name: PR Test - Kernel Operators (Ascend NPU)
# Build and install the kernel wheel before running operator tests.
on:
  pull_request:
    branches: [main]
    paths:
      - "csrc/**"
      - "!csrc/deepep/**"
      - "python/sgl_kernel_npu/**"
      - "tests/python/operators/**"
      - "tests/python/framework/**"
      - "tests/python/conftest.py"
      - "tests/python/__init__.py"
      - "tests/python/utils/**"
      - "tests/__init__.py"
      - "pytest.ini"
      - "build.sh"
      - "cmake/**"
      - "scripts/prepare_kernel_tests.sh"
      - "scripts/run_kernel_tests.sh"
      - "third_party/pto-isa/**"
      - "third_party/catlass/**"
      - ".gitmodules"
      - ".github/workflows/pr-test-kernels.yml"
      - ".github/workflows/pr-test-kernel-group.yml"
  workflow_dispatch:

concurrency:
  group: pr-test-kernels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  get-changed-files:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    outputs:
      speculative: ${{ steps.select.outputs.speculative }}
      matmul: ${{ steps.select.outputs.matmul }}
      mamba: ${{ steps.select.outputs.mamba }}
      moe: ${{ steps.select.outputs.moe }}
      embedding: ${{ steps.select.outputs.embedding }}
      data_move: ${{ steps.select.outputs.data_move }}
      activation: ${{ steps.select.outputs.activation }}
      attention: ${{ steps.select.outputs.attention }}
      batch_invariant: ${{ steps.select.outputs.batch_invariant }}
      elementwise: ${{ steps.select.outputs.elementwise }}
      examples: ${{ steps.select.outputs.examples }}
      hyper_conn: ${{ steps.select.outputs.hyper_conn }}
      indexer: ${{ steps.select.outputs.indexer }}
      lora: ${{ steps.select.outputs.lora }}
      mem_cache: ${{ steps.select.outputs.mem_cache }}
      multimodal: ${{ steps.select.outputs.multimodal }}
      norm: ${{ steps.select.outputs.norm }}
      rope: ${{ steps.select.outputs.rope }}
      sample: ${{ steps.select.outputs.sample }}
      sampler: ${{ steps.select.outputs.sampler }}
      operator_framework: ${{ steps.select.outputs.operator_framework }}
      testing_framework: ${{ steps.select.outputs.testing_framework }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select test groups
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          directories = {
              "speculative": "tests/python/operators/speculative/",
              "matmul": "tests/python/operators/matmul/",
              "mamba": "tests/python/operators/mamba/",
              "moe": "tests/python/operators/moe/",
              "embedding": "tests/python/operators/embedding/",
              "data_move": "tests/python/operators/data_move/",
              "activation": "tests/python/operators/activation/",
              "attention": "tests/python/operators/attention/",
              "batch_invariant": "tests/python/operators/batch_invariant/",
              "elementwise": "tests/python/operators/elementwise/",
              "examples": "tests/python/operators/examples/",
              "hyper_conn": "tests/python/operators/hyper_conn/",
              "indexer": "tests/python/operators/indexer/",
              "lora": "tests/python/operators/lora/",
              "mem_cache": "tests/python/operators/mem_cache/",
              "multimodal": "tests/python/operators/multimodal/",
              "norm": "tests/python/operators/norm/",
              "rope": "tests/python/operators/rope/",
              "sample": "tests/python/operators/sample/",
              "sampler": "tests/python/operators/sampler/",
              "operator_framework": "tests/python/framework/operator_framework/",
              "testing_framework": "tests/python/framework/testing_framework/",
          }
          active = {
              group for group, directory in directories.items()
              if any(path.is_file() for path in Path(directory).rglob("test_*.py"))
          }

          selected = set()
          if os.environ["EVENT_NAME"] == "workflow_dispatch":
              selected = active
          else:
              revision = os.environ["BASE_SHA"] + "..." + os.environ["HEAD_SHA"]
              changed = subprocess.check_output(
                  ["git", "diff", "--name-only", "--no-renames", "-z", revision, "--"]
              )
              for raw_path in changed.split(b"\0"):
                  if not raw_path:
                      continue
                  path = os.fsdecode(raw_path)
                  if path.startswith(("csrc/deepep/", "tests/python/sgl_kernel_npu/")):
                      continue
                  group = next(
                      (group for group, directory in directories.items()
                       if path.startswith(directory)),
                      None,
                  )
                  if group is None:
                      selected = active
                      break
                  if group in active:
                      selected.add(group)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for group in directories:
                  print(f"{group}={str(group in selected).lower()}", file=output)
          PY

