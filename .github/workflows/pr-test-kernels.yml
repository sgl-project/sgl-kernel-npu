name: PR Test - Kernel Operators (Ascend NPU)

on:
  pull_request:
    branches: [ main ]
    # Always run the cheap selector: GitHub path filters can truncate large PRs
    # and otherwise miss new global build dependencies. Docs select no NPU jobs.
  workflow_dispatch:

concurrency:
  group: pr-test-kernels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  get-changed-files:
    name: Check changed files
    runs-on: ubuntu-latest
    outputs:
      norm_changed: ${{ steps.select.outputs.norm_changed }}
      attention_changed: ${{ steps.select.outputs.attention_changed }}
      cache_changed: ${{ steps.select.outputs.cache_changed }}
      speculative_changed: ${{ steps.select.outputs.speculative_changed }}
      mamba_changed: ${{ steps.select.outputs.mamba_changed }}
      fla_changed: ${{ steps.select.outputs.fla_changed }}
      fused_changed: ${{ steps.select.outputs.fused_changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install selector dependencies
        run: python3 -m pip install PyYAML==6.0.2

      - name: Test selection and execution logic (CPU only)
        run: python3 -m unittest discover -s tests/ci -v

      - name: Select affected kernel tests
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            python3 scripts/select_kernel_tests.py --full
          else
            # The fork's commits are exposed by the upstream PR ref. Never rely
            # on a same-named branch in origin or on HEAD^ (the last commit).
            git fetch --no-tags origin "$BASE_SHA" "refs/pull/$PR_NUMBER/head"
            git cat-file -e "$HEAD_SHA^{commit}"
            python3 scripts/select_kernel_tests.py --base "$BASE_SHA" --head "$HEAD_SHA"
          fi

      - name: Upload test selection
        uses: actions/upload-artifact@v4
        with:
          name: kernel-test-selection
          path: kernel-test-selection.json
          if-no-files-found: error

  # 7 test-group jobs, one per domain, run in parallel (same structure as PR #518).
  # Adding 9.1.0 to each job's matrix doubles the parallelism to 14 combos.
  test-norm-ops:
    needs: get-changed-files
    if: |
      github.event_name == 'workflow_dispatch' || (
        github.event.pull_request.draft == false &&
        needs.get-changed-files.outputs.norm_changed == 'true'
      )
    strategy:
      fail-fast: false
      matrix:
        # NOTE: A2(910b) is NOT considered for now (hardware 暂不考虑 A2).
        # The a2 branch below is kept only as an extension point.
        # CANN 9.1.0 has no daily-built image yet, so the image below pins the
        # dated tag cann9.1.0-a3-20260818 (bump manually when a newer one comes).
        cann_version: [9.0.0, 9.1.0]
        hardware: [a3]
    runs-on: ${{ matrix.hardware == 'a3' && 'linux-aarch64-a3-800t-2' || 'linux-aarch64-a2-8' }}
    container:
      # Kernel operator tests only need a single NPU, so a3 uses the single-card runner.
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/dockerhub/lmsysorg/sglang:${{ matrix.cann_version == '9.0.0' && 'main-cann9.0.0-a3' || 'cann9.1.0-a3-20260818' }}
    env:
      CANN_VERSION: "${{ matrix.cann_version }}"
      TORCH_CACHE_URL: "http://cache-service.nginx-pypi-cache.svc.cluster.local/whl/cpu"
      PYPI_CACHE_URL: "http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple"
      GITHUB_PROXY_URL: "https://gh-proxy.test.osinfra.cn/"
      UV_INDEX_URL: http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple
    steps:
      - name: Clean git config
        run: |
          CONFIG_KEY='http.https://gh-proxy.test.osinfra.cn/.extraheader'
          git config --global --unset "$CONFIG_KEY" || true

      - name: Clean workspace
        run: |
          sudo rm -rf --one-file-system "$GITHUB_WORKSPACE"/* "$GITHUB_WORKSPACE"/.* 2>/dev/null || true

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: true
          submodules: recursive

      - name: Download test selection
        uses: actions/download-artifact@v4
        with:
          name: kernel-test-selection

      - name: Install dependencies
        run: |
          CACHING_URL="cache-service.nginx-pypi-cache.svc.cluster.local"
          sed -Ei "s@(ports|archive).ubuntu.com@${CACHING_URL}:8081@g" /etc/apt/sources.list
          pip config set global.index-url http://${CACHING_URL}/pypi/simple
          pip config set global.trusted-host ${CACHING_URL}
          pip install uv

          bash scripts/npu_ci_install_dependency.sh --cann-version ${{ matrix.cann_version }}

      - name: Build and install kernel module
        run: bash scripts/prepare_kernel_tests.sh

      - name: Run selected norm operator tests
        timeout-minutes: 35
        run: bash scripts/run_kernel_tests.sh --selection kernel-test-selection.json norm

      - name: Upload kernel test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: kernel-tests-norm-${{ matrix.hardware }}-cann${{ matrix.cann_version }}
          path: test-results/*.xml
          if-no-files-found: ignore

