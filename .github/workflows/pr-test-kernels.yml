      - name: Upload kernel test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: kernel-tests-fused-${{ matrix.hardware }}-cann${{ matrix.cann_version }}
          path: test-results/*.xml
          if-no-files-found: ignore

  finish:
    if: always()
    needs:
      - get-changed-files
      - test-norm-ops
      - test-attention-ops
      - test-cache-ops
      - test-speculative-ops
      - test-mamba-ops
      - test-fla-ops
      - test-fused-ops
    runs-on: ubuntu-latest
    steps:
      - name: Check all dependent job statuses
        run: |
          results=(${{ join(needs.*.result, ' ') }})
          for result in "${results[@]}"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "Job failed with result: $result"
              exit 1
            fi
          done
          if [ "${{ needs.get-changed-files.result }}" != "success" ]; then
            echo "Test selection did not succeed"
            exit 1
          fi
          echo "Selection succeeded and all scheduled kernel tests passed. See selection summary for skipped jobs."
