name: Agentic Workflow (PR Review)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, edited]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  pr_review:
    if: |
      github.actor != 'github-actions[bot]' &&
      (
        github.event_name == 'pull_request' ||
        (github.event_name == 'issue_comment' &&
          github.event.issue.pull_request != null &&
          (github.event.comment.author_association == 'OWNER' ||
            github.event.comment.author_association == 'MEMBER' ||
            github.event.comment.author_association == 'COLLABORATOR') &&
          (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode'))) ||
        (github.event_name == 'pull_request_review' &&
          (github.event.review.author_association == 'OWNER' ||
            github.event.review.author_association == 'MEMBER' ||
            github.event.review.author_association == 'COLLABORATOR') &&
          (contains(github.event.review.body, '/oc') || contains(github.event.review.body, '/opencode'))) ||
        (github.event_name == 'pull_request_review_comment' &&
          (github.event.comment.author_association == 'OWNER' ||
            github.event.comment.author_association == 'MEMBER' ||
            github.event.comment.author_association == 'COLLABORATOR') &&
          (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode')))
      )

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    concurrency:
      group: pr_review-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.issue.pull_request.head.sha }}
          persist-credentials: false

      # Review-only guard rails for the agent, scoped to this runner only
      # (global config, not the repo). "edit: deny" keeps the working tree
      # clean so the action's commit-and-push path is never reached (a dirty
      # tree is what failed runs #4/#5 with "fatal: empty ident name");
      # "git *: deny" blocks any git command from the agent.
      - name: Lock opencode to review-only permissions
        run: |
          mkdir -p ~/.config/opencode
          cat > ~/.config/opencode/opencode.json <<'JSON'
          {
            "$schema": "https://opencode.ai/config.json",
            "permission": {
              "edit": "deny",
              "bash": {
                "git *": "deny"
              }
            }
          }
          JSON

      - uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY_FOR_GHACTIONS }}
        with:
          use_github_token: true
          model: zhipuai-coding-plan/glm-5.3-flash
          prompt: |
            Review this pull request (number ${{ github.event.issue.number || github.event.pull_request.number }}):
            - This is a read-only review task. Do NOT modify, create, or delete any files. Do NOT run any git commands (no git add, git commit, git push, git checkout, git stash, git config, etc.). Only read code and produce your review.
            - Check for code quality issues
            - Look for potential bugs
            - Suggest improvements
