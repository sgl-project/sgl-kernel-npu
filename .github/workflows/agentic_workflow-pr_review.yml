name: Agentic Workflow (PR Review)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  pr_review:
    if: |
      github.actor != 'github-actions[bot]' &&
      (
        github.event_name == 'pull_request' ||
        (github.event_name == 'issue_comment' &&
          github.event.issue.pull_request != null &&
          (github.event.comment.author_association == 'OWNER' ||
            github.event.comment.author_association == 'MEMBER' ||
            github.event.comment.author_association == 'COLLABORATOR') &&
          (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode'))) ||
        (github.event_name == 'pull_request_review_comment' &&
          (github.event.comment.author_association == 'OWNER' ||
            github.event.comment.author_association == 'MEMBER' ||
            github.event.comment.author_association == 'COLLABORATOR') &&
          (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode')))
      )

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    concurrency:
      group: pr_review-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prepare PR diff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: gh pr diff "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" > pr.diff

      - uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY_FOR_GHACTIONS }}
        with:
          use_github_token: true
          model: zhipuai-coding-plan/glm-5.3-flash
          prompt: |
            Review this pull request (number ${{ github.event.issue.number || github.event.pull_request.number }}):
            - The full PR diff is in the file `pr.diff` in the working directory — read it first.
            - Check for code quality issues
            - Look for potential bugs
            - Suggest improvements
