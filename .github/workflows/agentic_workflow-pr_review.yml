name: Agentic Workflow (PR Review)

on:
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]

jobs:
  pr_review:
    if: |
      github.actor != 'github-actions[bot]' &&
      github.event.issue.pull_request != null &&
      (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode'))

    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read
      pull-requests: write

    concurrency:
      group: pr_review-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY_FOR_GHACTIONS }}
        with:
          use_github_token: true
          model: zhipuai-coding-plan/glm-5.3-flash
          prompt: |
            Review this pull request:
            - Check for code quality issues
            - Look for potential bugs
            - Suggest improvements
