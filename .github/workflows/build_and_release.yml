name: Build and Release SGL-Kernel-NPU

on:
  release:
    types: [published]

  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/build_and_release.yml
      - config.ini
      - build.sh

jobs:
  build-and-release:
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        npu_hardware: [a3, "950"]
        cann_version: ["9.1.0", "9.2.0"]
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: quay.io/ascend/cann:${{ matrix.cann_version }}-${{ matrix.npu_hardware }}-ubuntu22.04-py3.12
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_REMOTE_STORAGE: ${{ github.event_name == 'release' && vars.CCACHE_REMOTE_STORAGE || '' }}
      CCACHE_SECONDARY_STORAGE: ${{ github.event_name == 'release' && vars.CCACHE_REMOTE_STORAGE || '' }}
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 20G

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install dependency
        run: |
          bash scripts/npu_ci_install_dependency.sh \
            --cann-version "${{ matrix.cann_version }}"

      - name: Verify ccache
        run: |
          ccache --version
          ccache -p | grep -E 'remote_storage|secondary_storage' || true

      - name: Configure ccache
        run: |
          set -euo pipefail

          mkdir -p "${CCACHE_DIR}"
          ccache --set-config=compiler_check=content
          ccache --set-config=base_dir="${CCACHE_BASEDIR}"
          ccache --set-config=hash_dir=false
          ccache --set-config=max_size="${CCACHE_MAXSIZE}"

          if [[ -n "${CCACHE_REMOTE_STORAGE}" ]]; then
            cache_url="${CCACHE_REMOTE_STORAGE%% *}"
            if ccache -p | grep -q 'remote_storage'; then
              ccache --set-config=remote_storage="${cache_url} @connect-timeout=5000 @operation-timeout=60000"
            else
              ccache --set-config=secondary_storage="${cache_url}|connect-timeout=5000|operation-timeout=60000"
            fi
          fi

          ccache -p | grep -E 'cache_dir|base_dir|hash_dir|compiler_check|max_size|remote_storage|secondary_storage'

      - name: Verify remote ccache server
        if: github.event_name == 'release'
        run: |
          set -euo pipefail

          if [[ -z "${CCACHE_REMOTE_STORAGE}" ]]; then
            echo "CCACHE_REMOTE_STORAGE is not configured" >&2
            exit 1
          fi

          base_url="${CCACHE_REMOTE_STORAGE%% *}"
          test_url="${base_url}/runner-${GITHUB_RUN_ID}"
          trap 'curl -fsS -X DELETE "${test_url}" >/dev/null 2>&1 || true' EXIT

          curl --fail --silent --show-error \
            --retry 3 --retry-connrefused \
            -X PUT --data-binary "ccache-test" "${test_url}"

          result="$(curl --fail --silent --show-error \
            --retry 3 --retry-connrefused "${test_url}")"

          test "${result}" = "ccache-test"

      - name: Build SGL-Kernel-NPU for a3
        if: matrix.npu_hardware != '950'
        run: |
          env -i \
            PATH="${PATH}" \
            CCACHE_DIR="${CCACHE_DIR}" \
            bash --login -c '
              set -euo pipefail
              export LD_LIBRARY_PATH="${ASCEND_HOME_PATH}/runtime/lib64/stub:${LD_LIBRARY_PATH:-}:${ASCEND_HOME_PATH}/$(arch)-linux/devlib"
              python3 setup.py --arch-version 2201 --ops all --artifact wheel -j 8
            '

      - name: Build SGL-Kernel-NPU for 950
        if: matrix.npu_hardware == '950'
        run: |
          env -i \
            PATH="${PATH}" \
            CCACHE_DIR="${CCACHE_DIR}" \
            bash --login -c '
              set -euo pipefail
              export LD_LIBRARY_PATH="${ASCEND_HOME_PATH}/runtime/lib64/stub:${LD_LIBRARY_PATH:-}:${ASCEND_HOME_PATH}/$(arch)-linux/devlib"
              python3 setup.py --arch-version 3510 --ops all --artifact wheel -j 2
            '

      - name: Build Attentions
        run: |
          env -i \
            PATH="${PATH}" \
            CCACHE_DIR="${CCACHE_DIR}" \
            bash --login -c '
              set -euo pipefail
              export LD_LIBRARY_PATH="${ASCEND_HOME_PATH}/runtime/lib64/stub:${LD_LIBRARY_PATH:-}"
              ./build.sh -a attentions
            '

      - name: Build Torch-Memory-Saver
        run: |
          env -i \
            PATH="${PATH}" \
            CCACHE_DIR="${CCACHE_DIR}" \
            bash --login -c '
              set -euo pipefail
              export LD_LIBRARY_PATH="${ASCEND_HOME_PATH}/runtime/lib64/stub:${LD_LIBRARY_PATH:-}"
              ./build.sh -a memory-saver
            '

      - name: Build DeepEP for a3
        if: matrix.npu_hardware == 'a3'
        run: |
          env -i \
            PATH="${PATH}" \
            CCACHE_DIR="${CCACHE_DIR}" \
            bash --login -c '
              set -euo pipefail
              export LD_LIBRARY_PATH="${ASCEND_HOME_PATH}/runtime/lib64/stub:${LD_LIBRARY_PATH:-}"
              ./build.sh -a deepep
            '

      - name: Build DeepEP for 950
        if: matrix.npu_hardware == '950'
        run: |
          env -i \
            PATH="${PATH}" \
            CCACHE_DIR="${CCACHE_DIR}" \
            bash --login -c '
              set -euo pipefail
              export LD_LIBRARY_PATH="${ASCEND_HOME_PATH}/runtime/lib64/stub:${LD_LIBRARY_PATH:-}"
              ./build.sh -a deepep Ascend950
            '

      - name: Show ccache statistics
        if: always()
        run: |
          ccache --show-stats --verbose || true

      - name: Pack up packages
        run: |
          set -euo pipefail

          export TORCH_DEVICE_BACKEND_AUTOLOAD=0

          torch_version="$(
            python3 -c 'import torch; print(torch.__version__.split("+")[0])'
          )"

          python_version="$(
            python3 -c 'import platform; print(platform.python_version())' |
              awk -F. '{print $1 $2}'
          )"

          release_tag="${{ github.event.release.tag_name || github.sha }}"
          package_name="sgl-kernel-npu-${release_tag}-torch${torch_version}-py${python_version}-cann${{ matrix.cann_version }}-${{ matrix.npu_hardware }}-${{ matrix.arch }}.zip"

          cd output
          zip -v "${package_name}" ./*.whl
          ls -al

      - name: Upload Release Artifacts
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: ./output/*.zip
