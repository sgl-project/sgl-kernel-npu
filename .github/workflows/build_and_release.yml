name: Build and Release SGL-Kernel-NPU

on:
  release:
    types:
      - published

  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/build_and_release.yml
      - config.ini
      - build.sh

jobs:
  build-and-release:
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        npu_hardware: [a3, '950']
        cann_version: ['9.1.0', '9.2.0']
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: quay.io/ascend/cann:${{ matrix.cann_version }}-${{ matrix.npu_hardware }}-ubuntu22.04-py3.12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Mark repository safe
        run: |
          git config --system --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Install dependency
        run: |
          bash scripts/npu_ci_install_dependency.sh \
            --cann-version "${{ matrix.cann_version }}"

      - name: Build SGL-Kernel-NPU for a3
        if: matrix.npu_hardware != '950'
        run: |
          env -i PATH="${PATH}" bash --login -c "
            export LD_LIBRARY_PATH=${ASCEND_HOME_PATH}/runtime/lib64/stub:${LD_LIBRARY_PATH} &&
            ./build.sh -a kernels
          "

      - name: Build SGL-Kernel-NPU for 950
        if: matrix.npu_hardware == '950'
        run: |
          env -i PATH="${PATH}" bash --login -c "
            export LD_LIBRARY_PATH=${ASCEND_HOME_PATH}/runtime/lib64/stub:${LD_LIBRARY_PATH} &&
            ./build.sh -a kernels Ascend950PR_9599
          "

      - name: Build Attentions
        run: |
          env -i PATH="${PATH}" bash --login -c "
            export LD_LIBRARY_PATH=${ASCEND_HOME_PATH}/runtime/lib64/stub:${LD_LIBRARY_PATH} &&
            ./build.sh -a attentions
          "

      - name: Build Torch-Memory-Saver
        run: |
          env -i PATH="${PATH}" bash --login -c "
            export LD_LIBRARY_PATH=${ASCEND_HOME_PATH}/runtime/lib64/stub:${LD_LIBRARY_PATH} &&
            ./build.sh -a memory-saver
          "

      - name: Build DeepEP for a3
        if: matrix.npu_hardware == 'a3'
        run: |
          env -i PATH="${PATH}" bash --login -c "
            export LD_LIBRARY_PATH=${ASCEND_HOME_PATH}/runtime/lib64/stub:${LD_LIBRARY_PATH} &&
            ./build.sh -a deepep
          "

      - name: Build DeepEP for 950
        if: matrix.npu_hardware == '950'
        run: |
          env -i PATH="${PATH}" bash --login -c "
            export LD_LIBRARY_PATH=${ASCEND_HOME_PATH}/runtime/lib64/stub:${LD_LIBRARY_PATH} &&
            ./build.sh -a deepep Ascend950
          "

      - name: Pack up packages
        run: |
          export TORCH_DEVICE_BACKEND_AUTOLOAD=0
          TORCH_VERSION="$(
            python3 -c 'import torch; print(torch.__version__.split("+")[0])'
          )"
          PYTHON_VERSION="$(
            python3 -c 'import platform; print(platform.python_version())' |
              awk -F'.' '{print $1$2}'
          )"
          PACKAGE_NAME="sgl-kernel-npu-${{ github.event.release.tag_name }}-torch${TORCH_VERSION}-py${PYTHON_VERSION}-cann${{ matrix.cann_version }}-${{ matrix.npu_hardware }}-${{ matrix.arch }}.zip"
          cd output/
          zip -v "${PACKAGE_NAME}" ./*.whl
          ls -al

      - name: Upload Release Artifacts
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: ./output/*.zip

  build-ops-transformer:
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        npu_hardware: [a3, '950']
        cann_version: ['9.1.0', '9.2.0']
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: quay.io/ascend/cann:${{ matrix.cann_version }}-${{ matrix.npu_hardware }}-ubuntu22.04-py3.12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Mark repository safe
        run: |
          git config --system --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Install dependency
        run: |
          bash scripts/npu_ci_install_dependency.sh \
            --cann-version "${{ matrix.cann_version }}"

      - name: Debug tag info
        if: github.event_name == 'release'
        run: |
          echo "github.ref = ${{ github.ref }}"
          echo "tag from release event = ${{ github.event.release.tag_name }}"

      - name: Build ops-transformer for a3
        if: matrix.npu_hardware == 'a3'
        run: |
          cd ../
          git clone --depth 1 https://gitcode.com/cann/ops-transformer.git
          cd ops-transformer

          case "${{ matrix.cann_version }}" in
            "9.1.0")
              OPS_TRANSFORMER_COMMIT="bcc6304656c9e712b50b1faa22872a158b1e34c5"
              ;;
            "9.2.0")
              OPS_TRANSFORMER_COMMIT="33cc4ab2c7efe16d4f78b34a0dc52dbc99b9d8f8"
              ;;
            *)
              echo "Unsupported CANN version: ${{ matrix.cann_version }}" >&2
              exit 1
              ;;
          esac

          git fetch --depth 1 origin "${OPS_TRANSFORMER_COMMIT}"
          git checkout --detach "${OPS_TRANSFORMER_COMMIT}"

          env -i PATH="${PATH}" bash --login -c "
            pip install packaging ninja
            bash build.sh --pkg --experimental --soc=ascend910_93 --ops=\"sparse_attn_sharedkv,sparse_attn_sharedkv_metadata,quant_lightning_indexer,quant_lightning_indexer_metadata,compressor\"
          "

      - name: Build ops-transformer for 950
        if: matrix.npu_hardware == '950'
        run: |
          cd ../
          git clone --depth 1 https://gitcode.com/cann/ops-transformer.git
          cd ops-transformer

          case "${{ matrix.cann_version }}" in
            "9.1.0")
              OPS_TRANSFORMER_COMMIT="bcc6304656c9e712b50b1faa22872a158b1e34c5"
              OPS_LIST="quant_lightning_indexer,quant_lightning_indexer_metadata,compressor,kv_quant_sparse_attn_sharedkv,kv_quant_sparse_attn_sharedkv_metadata,kv-compressor_epilog,hc_post,inplace_partial_rotary_mul,indexer_compress_epilog,moe_gating_top_k"
              ;;
            "9.2.0")
              OPS_TRANSFORMER_COMMIT="33cc4ab2c7efe16d4f78b34a0dc52dbc99b9d8f8"
              OPS_LIST="quant_lightning_indexer,quant_lightning_indexer_metadata,compressor,kv_quant_sparse_attn_sharedkv,kv_quant_sparse_attn_sharedkv_metadata,kv_compress_epilog,mhc_post,inplace_partial_rotary_mul,indexer_quant_cache,moe_gating_top_k"
              ;;
            *)
              echo "Unsupported CANN version: ${{ matrix.cann_version }}" >&2
              exit 1
              ;;
          esac

          git fetch --depth 1 origin "${OPS_TRANSFORMER_COMMIT}"
          git checkout --detach "${OPS_TRANSFORMER_COMMIT}"

          env -i PATH="${PATH}" bash --login -c "
            pip install packaging ninja
            bash build.sh --pkg --experimental --soc=ascend950 --ops=\"${OPS_LIST}\"
          "

      - name: Pack up packages
        run: |
          export TORCH_DEVICE_BACKEND_AUTOLOAD=0
          TORCH_VERSION="$(
            python3 -c 'import torch; print(torch.__version__.split("+")[0])'
          )"
          PACKAGE_NAME="ops-transformer-${{ github.event.release.tag_name }}-torch${TORCH_VERSION}-cann${{ matrix.cann_version }}-${{ matrix.npu_hardware }}-${{ matrix.arch }}.zip"
          cd ../ops-transformer/build_out
          zip -v "${PACKAGE_NAME}" ./*.run
          ls -al

      - name: Upload Release Artifacts
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: ../ops-transformer/build_out/*.zip

  build-custom-ops:
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        npu_hardware: [a3, '950']
        cann_version: ['9.1.0', '9.2.0']
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: quay.io/ascend/cann:${{ matrix.cann_version }}-${{ matrix.npu_hardware }}-ubuntu22.04-py3.12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Mark repository safe
        run: |
          git config --system --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Install dependency
        run: |
          bash scripts/npu_ci_install_dependency.sh \
            --cann-version "${{ matrix.cann_version }}"

      - name: Debug tag info
        if: github.event_name == 'release'
        run: |
          echo "github.ref = ${{ github.ref }}"
          echo "tag from release event = ${{ github.event.release.tag_name }}"

      - name: Build cann-custom for a3
        if: matrix.npu_hardware == 'a3'
        run: |
          cd ../
          git clone --depth 1 https://gitcode.com/cann/cann-recipes-infer.git
          cd cann-recipes-infer

          case "${{ matrix.cann_version }}" in
            "9.1.0")
              CANN_RECIPES_COMMIT="35a476c2b1ea61990380a7115ea991023aedc7d0"
              ;;
            "9.2.0")
              CANN_RECIPES_COMMIT="6d060311ae75f6105fe4216e20566875da5a8838"
              ;;
            *)
              echo "Unsupported CANN version: ${{ matrix.cann_version }}" >&2
              exit 1
              ;;
          esac

          git fetch --depth 1 origin "${CANN_RECIPES_COMMIT}"
          git checkout --detach "${CANN_RECIPES_COMMIT}"

          env -i PATH="${PATH}" bash --login -c "
            cd ops/ascendc/torch_ops_extension
            pip install ninja
            bash build_and_install.sh
          "

          env -i PATH="${PATH}" bash --login -c "
            cd ops/ascendc
            bash build.sh -c \"ascend910_93\"
          "

      - name: Build cann-custom for 950
        if: matrix.npu_hardware == '950'
        run: |
          cd ../
          git clone --depth 1 https://gitcode.com/cann/cann-recipes-infer.git
          cd cann-recipes-infer

          case "${{ matrix.cann_version }}" in
            "9.1.0")
              CANN_RECIPES_COMMIT="35a476c2b1ea61990380a7115ea991023aedc7d0"
              ;;
            "9.2.0")
              CANN_RECIPES_COMMIT="6d060311ae75f6105fe4216e20566875da5a8838"
              ;;
            *)
              echo "Unsupported CANN version: ${{ matrix.cann_version }}" >&2
              exit 1
              ;;
          esac

          git fetch --depth 1 origin "${CANN_RECIPES_COMMIT}"
          git checkout --detach "${CANN_RECIPES_COMMIT}"

          env -i PATH="${PATH}" bash --login -c "
            cd ops/ascendc/torch_ops_extension
            pip install ninja
            bash build_and_install.sh
          "

          env -i PATH="${PATH}" bash --login -c "
            cd ops/ascendc
            bash build.sh -c \"ascend950\"
          "

      - name: Pack up packages
        run: |
          export TORCH_DEVICE_BACKEND_AUTOLOAD=0
          TORCH_VERSION="$(
            python3 -c 'import torch; print(torch.__version__.split("+")[0])'
          )"
          PACKAGE_NAME="custom-ops-${{ github.event.release.tag_name }}-torch${TORCH_VERSION}-cann${{ matrix.cann_version }}-${{ matrix.npu_hardware }}-${{ matrix.arch }}.zip"
          cd ../cann-recipes-infer
          mkdir -p output
          cp ./ops/ascendc/torch_ops_extension/dist/custom_ops-*.whl ./output
          cp ./ops/ascendc/output/CANN-custom_ops-*.run ./output
          cd output
          zip -v "${PACKAGE_NAME}" ./*.run ./*.whl
          ls -al

      - name: Upload Release Artifacts
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: ../cann-recipes-infer/output/*.zip
