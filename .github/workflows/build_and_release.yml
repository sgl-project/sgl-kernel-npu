name: Build and Release SGL-Kernel-NPU

on:
  release:
    types:
      - published

  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/build_and_release.yml
      - config.ini
      - build.sh
      - setup.py
      - python/sgl_kernel_npu/**
      - third_party/**

jobs:
  build-and-release:
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64]
        npu_hardware: [a3, '950']
        cann_version: ['9.1.0', '9.2.0']
    runs-on: ${{ matrix.hardware == 'a3' && 'linux-aarch64-a3-800t-16' || 'linux-aarch64-a2-8' }}
    container:
      image: quay.io/ascend/cann:${{ matrix.cann_version }}-${{ matrix.npu_hardware }}-ubuntu22.04-py3.12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install dependency
        run: |
          bash scripts/npu_ci_install_dependency.sh \
            --cann-version "${{ matrix.cann_version }}"

      - name: Build SGL-Kernel-NPU for a3
        if: matrix.npu_hardware != '950'
        run: |
          env -i PATH="${PATH}" bash --login -c "
            export LD_LIBRARY_PATH=${ASCEND_HOME_PATH}/runtime/lib64/stub:${LD_LIBRARY_PATH}:${ASCEND_HOME_PATH}/\$(arch)-linux/devlib &&
            python3 setup.py --arch-version 2201 --ops all --artifact wheel -j 8
          "

      - name: Build SGL-Kernel-NPU for 950
        if: matrix.npu_hardware == '950'
        run: |
          env -i PATH="${PATH}" bash --login -c "
            export LD_LIBRARY_PATH=${ASCEND_HOME_PATH}/runtime/lib64/stub:${LD_LIBRARY_PATH}:${ASCEND_HOME_PATH}/\$(arch)-linux/devlib &&
            python3 setup.py --arch-version 3510 --ops all --artifact wheel -j 2
          "
      - name: Build Attentions
        run: |
          env -i PATH="${PATH}" bash --login -c "
            export LD_LIBRARY_PATH=${ASCEND_HOME_PATH}/runtime/lib64/stub:${LD_LIBRARY_PATH} &&
            ./build.sh -a attentions
          "

      - name: Build Torch-Memory-Saver
        run: |
          env -i PATH="${PATH}" bash --login -c "
            export LD_LIBRARY_PATH=${ASCEND_HOME_PATH}/runtime/lib64/stub:${LD_LIBRARY_PATH} &&
            ./build.sh -a memory-saver
          "

      - name: Build DeepEP for a3
        if: matrix.npu_hardware == 'a3'
        run: |
          env -i PATH="${PATH}" bash --login -c "
            export LD_LIBRARY_PATH=${ASCEND_HOME_PATH}/runtime/lib64/stub:${LD_LIBRARY_PATH} &&
            ./build.sh -a deepep
          "

      - name: Build DeepEP for 950
        if: matrix.npu_hardware == '950'
        run: |
          env -i PATH="${PATH}" bash --login -c "
            export LD_LIBRARY_PATH=${ASCEND_HOME_PATH}/runtime/lib64/stub:${LD_LIBRARY_PATH} &&
            ./build.sh -a deepep Ascend950
          "

      - name: Pack up packages
        run: |
          export TORCH_DEVICE_BACKEND_AUTOLOAD=0
          TORCH_VERSION="$(
            python3 -c 'import torch; print(torch.__version__.split("+")[0])'
          )"
          PYTHON_VERSION="$(
            python3 -c 'import platform; print(platform.python_version())' |
              awk -F'.' '{print $1$2}'
          )"
          PACKAGE_NAME="sgl-kernel-npu-${{ github.event.release.tag_name }}-torch${TORCH_VERSION}-py${PYTHON_VERSION}-cann${{ matrix.cann_version }}-${{ matrix.npu_hardware }}-${{ matrix.arch }}.zip"
          cd output/
          zip -v "${PACKAGE_NAME}" ./*.whl
          ls -al

      - name: Upload Release Artifacts
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: ./output/*.zip
