name: Reusable Kernel Operator Group Tests

on:
  workflow_call:
    inputs:
      group:
        description: Kernel test group
        required: true
        type: string
      cann_version:
        required: true
        type: string
      npu_hardware:
        required: true
        type: string
      timeout_minutes:
        required: false
        type: number
        default: 20

jobs:
  run-kernel-group:
    name: ${{ inputs.group }} (CANN ${{ inputs.cann_version }}, ${{ inputs.npu_hardware }})
    runs-on: ${{ inputs.npu_hardware == '950' && 'linux-amd64-a5-1' || 'linux-aarch64-a3-800t-2' }}
    timeout-minutes: 180
    container:
      image: quay.io/ascend/cann:${{ inputs.cann_version }}-${{ inputs.npu_hardware }}-ubuntu22.04-py3.12
    env:
      CANN_VERSION: ${{ inputs.cann_version }}
      GITHUB_PROXY_URL: "https://gh-proxy.test.osinfra.cn/"
    steps:
      - name: Clean git config
        run: |
          CONFIG_KEY='http.https://gh-proxy.test.osinfra.cn/.extraheader'
          git config --global --unset "$CONFIG_KEY" || true
      - name: Clean workspace
        run: |
          sudo rm -rf --one-file-system "$GITHUB_WORKSPACE"/* "$GITHUB_WORKSPACE"/.* 2>/dev/null || true
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: true
          submodules: recursive
      - name: Install dependencies
        run: |
          pip install uv
          bash scripts/npu_ci_install_dependency.sh --cann-version "${{ inputs.cann_version }}"
      - name: Set up Triton-Ascend and kernel test dependencies
        run: bash scripts/prepare_kernel_tests.sh
      - name: Run kernel operator group tests
        timeout-minutes: ${{ inputs.timeout_minutes }}
        env:
          HCCL_BUFFSIZE: 4096
        run: bash scripts/run_kernel_tests.sh "${{ inputs.group }}"
