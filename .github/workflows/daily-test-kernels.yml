name: Daily Kernel Operator Tests (Ascend NPU)

on:
  schedule:
    - cron: "0 18 * * *"
  pull_request:
    branches: [ main ]
    paths:
      - ".github/workflows/daily-test-kernels.yml"
      - "scripts/prepare_kernel_tests.sh"
      - "scripts/run_kernel_tests.sh"
  workflow_dispatch:

concurrency:
  group: daily-kernel-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-daily-kernel-tests:
    name: Kernel Tests (CANN ${{ matrix.cann_version }}, ${{ matrix.npu_hardware }})
    runs-on: ${{ matrix.npu_hardware == '950' && 'linux-amd64-a5-1' || 'linux-aarch64-a3-800t-2' }}
    container:
      image: quay.io/ascend/cann:${{ matrix.cann_version }}-${{ matrix.npu_hardware }}-ubuntu22.04-py3.12
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        cann_version: ['9.1.0']
        npu_hardware: [a3, '950']
    env:
      CANN_VERSION: "${{ matrix.cann_version }}"
      NPU_HARDWARE: "${{ matrix.npu_hardware }}"
      GITHUB_PROXY_URL: "https://gh-proxy.test.osinfra.cn/"

    steps:
      - name: Clean git config
        run: |
          CONFIG_KEY='http.https://gh-proxy.test.osinfra.cn/.extraheader'
          git config --global --unset "$CONFIG_KEY" || true

      - name: Clean workspace
        run: |
          sudo rm -rf --one-file-system "$GITHUB_WORKSPACE"/* "$GITHUB_WORKSPACE"/.* 2>/dev/null || true

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: true
          submodules: recursive

      - name: Install dependencies
        run: |
          pip install uv

          bash scripts/npu_ci_install_dependency.sh --cann-version ${{ matrix.cann_version }}

      - name: Set up Triton-Ascend and kernel test dependencies
        run: bash scripts/prepare_kernel_tests.sh

      - name: Run all kernel operator tests
        timeout-minutes: 120
        env:
          HCCL_BUFFSIZE: 4096
        run: |
          bash scripts/run_kernel_tests.sh all

  finish:
    if: always()
    needs: [run-daily-kernel-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Generate test report
        run: |
          echo "## Daily Kernel Operator Tests Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Overall Status**: Kernel=${{ needs.run-daily-kernel-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "**Execution Time**: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow Run**: [$GITHUB_RUN_ID](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)" >> $GITHUB_STEP_SUMMARY
