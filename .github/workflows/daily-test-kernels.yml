name: Daily Kernel Operator Tests (Ascend NPU)

on:
  schedule:
    - cron: "0 18 * * *"
  pull_request:
    branches: [ main ]
    paths:
      - ".github/workflows/daily-test-kernels.yml"
      - "scripts/prepare_kernel_tests.sh"
      - "scripts/run_kernel_tests.sh"
  workflow_dispatch:

concurrency:
  group: daily-kernel-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-daily-kernel-tests:
    name: Kernel Tests (CANN ${{ matrix.cann_version }}, ${{ matrix.hardware }})
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - cann_version: '9.1.0'
            hardware: a3
            runner: linux-aarch64-a3-800t-2
            image: swr.cn-southwest-2.myhuaweicloud.com/base_image/dockerhub/lmsysorg/sglang:cann9.1.0-a3-B106

          - cann_version: '9.2.0'
            hardware: a3
            runner: linux-aarch64-a3-800t-2
            image: swr.cn-southwest-2.myhuaweicloud.com/base_image/dockerhub/lmsysorg/sglang:20261022-cann9.2.0-a3

          - cann_version: '9.1.0'
            hardware: a5
            runner: linux-amd64-a5-4
            image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann:9.1.0-950-ubuntu22.04-py3.12

          - cann_version: '9.2.0'
            hardware: a5
            runner: linux-amd64-a5-4
            image: swr.cn-southwest-2.myhuaweicloud.com/base_image/dockerhub/lmsysorg/sglang:20261022-cann9.2.0-950
    env:
      CANN_VERSION: "${{ matrix.cann_version }}"
      GITHUB_PROXY_URL: "https://gh-proxy.test.osinfra.cn/"

    steps:
      - name: Clean git config
        run: |
          CONFIG_KEY='http.https://gh-proxy.test.osinfra.cn/.extraheader'
          git config --global --unset "$CONFIG_KEY" || true

      - name: Clean workspace
        run: |
          sudo rm -rf --one-file-system "$GITHUB_WORKSPACE"/* "$GITHUB_WORKSPACE"/.* 2>/dev/null || true

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: true
          submodules: recursive

      - name: Install dependencies
        run: |
          pip install uv

          bash scripts/npu_ci_install_dependency.sh --cann-version ${{ matrix.cann_version }}

      - name: Build and install kernel module
        run: bash scripts/prepare_kernel_tests.sh

      - name: Run all kernel operator tests
        timeout-minutes: 120
        env:
          HCCL_BUFFSIZE: 4096
        run: |
          bash scripts/run_kernel_tests.sh all

  finish:
    if: always()
    needs: [run-daily-kernel-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Generate test report
        run: |
          echo "## Daily Kernel Operator Tests Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Overall Status**: Kernel=${{ needs.run-daily-kernel-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "**Execution Time**: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow Run**: [$GITHUB_RUN_ID](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)" >> $GITHUB_STEP_SUMMARY
