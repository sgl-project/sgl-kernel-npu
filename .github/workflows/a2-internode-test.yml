name: A2 Internode Test (Ascend NPU)

on:
  pull_request:
    branches: [ main ]
    paths:
      - "csrc/deepep/ops2/**"
      - ".github/workflows/a2-internode-test.yml"
      - ".github/workflows/internode.yml"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: a2-internode-test-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  multi-node-internode:
    name: multi-node
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        # A2 多机支持 9.0.0 / 9.1.0（与 pr-test-deepep-npu.yml 的 A2 矩阵一致）
        cann_version: [9.0.0, 9.1.0]
        test_config:
          - name: test_internode_a2
            node_size: 2
            test_case: tests/python/deepep/test_internode_a2.py
    uses: ./.github/workflows/internode.yml
    with:
      soc_version: a2
      runner: linux-aarch64-a2-0
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann:${{ matrix.cann_version }}-910b-ubuntu22.04-py${{ matrix.cann_version == '9.1.0' && '3.12' || '3.11' }}
      test_config_name: ${{ matrix.test_config.name }}
      node_size: ${{ matrix.test_config.node_size }}
      test_case: ${{ matrix.test_config.test_case }}
