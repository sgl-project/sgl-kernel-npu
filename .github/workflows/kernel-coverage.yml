name: Kernel Coverage
on:
  workflow_dispatch:
    inputs:
      upload_obs:
        description: Upload baseline to OBS (overwrites existing files)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  coverage:
    strategy:
      fail-fast: false
      matrix:
        include:
          - chip: a3
            hardware: a3
            runner: linux-aarch64-a3-800t-2
          - chip: a5
            hardware: '950'
            runner: linux-amd64-a5-1
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    container:
      image: quay.io/ascend/cann:9.1.0-${{ matrix.hardware }}-ubuntu22.04-py3.12
    env:
      CANN_VERSION: '9.1.0'
      NPU_HARDWARE: ${{ matrix.hardware }}
      GITHUB_PROXY_URL: https://gh-proxy.test.osinfra.cn/
      HCCL_BUFFSIZE: 4096
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          pip install uv
          bash scripts/npu_ci_install_dependency.sh --cann-version "$CANN_VERSION"
          bash scripts/prepare_kernel_tests.sh
      - name: Collect kernel coverage
        env:
          PIP_INDEX_URL: https://mirrors.huaweicloud.com/repository/pypi/simple
        run: |
          python -m pip install coverage
          rm -rf -- coverage-out
          KERNEL_COVERAGE_DIR=coverage-out bash scripts/run_kernel_tests.sh norm
          git rev-parse HEAD > coverage-out/baseline-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: kernel-coverage-${{ matrix.chip }}
          path: coverage-out/
          if-no-files-found: error
          include-hidden-files: true

      - uses: actions/checkout@v4
        with:
          path: baseline-src
          submodules: recursive
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: kernel-coverage-${{ matrix.chip }}
          path: baselines/kernel-coverage-${{ matrix.chip }}
      - name: Install coverage
        env:
          PIP_INDEX_URL: https://mirrors.huaweicloud.com/repository/pypi/simple
        run: python -m pip install coverage
      - name: Validate coverage inputs
        shell: bash
        run: |
          for chip in "${{ matrix.chip }}"; do
            dir="baselines/kernel-coverage-$chip"
            test "$(cat "$dir/baseline-sha.txt")" = "$GITHUB_SHA"
            test -s "$dir/coverage.xml"
            test -n "$(find "$dir" -type f -path '*/covdata/coverage' -print -quit)"
          done
      - name: Map installed package paths to baseline source
        shell: bash
        run: |
          config="$RUNNER_TEMP/kernel-merge.coveragerc"
          printf '[paths]\nkernel =\n    %s\n    */site-packages/sgl_kernel_npu\n' \
            "$GITHUB_WORKSPACE/baseline-src/python/sgl_kernel_npu/sgl_kernel_npu" > "$config"
          while IFS= read -r -d '' data; do
            # Apply [paths] to each database while retaining its test identity.
            tmp="$(mktemp -d "$RUNNER_TEMP/kernel-coverage.XXXXXXXX")"
            COVERAGE_FILE="$tmp/coverage" python -m coverage combine \
              --rcfile="$config" --keep "$data"
            mv -- "$tmp/coverage" "$data"
            rmdir -- "$tmp"
          done < <(find baselines -type f \( -path '*/covdata/coverage' -o -name '.coverage' \) -print0)
      - name: Build hardware map
        uses: lb-actions/precision-test@v1.0.10
        with:
          repo: sglang-kernel
          build-map: true
          source-dir: ${{ github.workspace }}/baseline-src
          coverage-dir: ${{ github.workspace }}/baselines/kernel-coverage-${{ matrix.chip }}
          map-file: ${{ github.workspace }}/baselines/kernel-coverage-${{ matrix.chip }}/test_case_map.json
      - name: Package source, maps and coverage separately
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_DIR="$RUNNER_TEMP/kernel-deliverables"
          mkdir -p "$PACKAGE_DIR/source" "$PACKAGE_DIR/maps" "$PACKAGE_DIR/coverage"
          BASELINE_SHA="$(git -C baseline-src rev-parse HEAD)"
          for chip in "${{ matrix.chip }}"; do
            test "$(cat "baselines/kernel-coverage-$chip/baseline-sha.txt")" = "$BASELINE_SHA"
            test -s "baselines/kernel-coverage-$chip/test_case_map.json"
            cp "baselines/kernel-coverage-$chip/test_case_map.json" "$PACKAGE_DIR/maps/test_case_map_$chip.json"
          done
          printf '%s\n' "$BASELINE_SHA" > "$PACKAGE_DIR/source/baseline-sha.txt"
          cp "$PACKAGE_DIR/source/baseline-sha.txt" "$PACKAGE_DIR/maps/"
          tar --exclude='.git' -czf "$PACKAGE_DIR/source/baseline-source.tar.gz" -C baseline-src .
          tar --exclude='test_case_map.json' -czf "$PACKAGE_DIR/coverage/coverage-data.tar.gz" -C "$GITHUB_WORKSPACE" baselines
          tar -tzf "$PACKAGE_DIR/source/baseline-source.tar.gz" > "$RUNNER_TEMP/kernel-source-files.txt"
          tar -tzf "$PACKAGE_DIR/coverage/coverage-data.tar.gz" > "$RUNNER_TEMP/kernel-coverage-files.txt"
          for chip in "${{ matrix.chip }}"; do
            grep -q "baselines/kernel-coverage-$chip/coverage.xml" "$RUNNER_TEMP/kernel-coverage-files.txt"
          done
      - name: Upload baseline source
        uses: actions/upload-artifact@v4
        with:
          name: kernel-source-${{ matrix.chip }}-full
          path: ${{ runner.temp }}/kernel-deliverables/source/
          if-no-files-found: error
      - name: Upload test case maps
        uses: actions/upload-artifact@v4
        with:
          name: kernel-maps-${{ matrix.chip }}-full
          path: ${{ runner.temp }}/kernel-deliverables/maps/
          if-no-files-found: error
      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: kernel-coverage-data-${{ matrix.chip }}-full
          path: ${{ runner.temp }}/kernel-deliverables/coverage/
          if-no-files-found: error
      - name: Publish baseline to OBS
        if: ${{ inputs.upload_obs }}
        shell: bash
        env:
          OBS_ACCESS_KEY_ID: ${{ secrets.OBS_ACCESS_KEY_PRECISION }}
          OBS_SECRET_ACCESS_KEY: ${{ secrets.OBS_SECRET_ACCESS_KEY_PRECISION }}
        run: |
          set -euo pipefail
          : "${OBS_ACCESS_KEY_ID:?Set OBS_ACCESS_KEY_PRECISION}"
          : "${OBS_SECRET_ACCESS_KEY:?Set OBS_SECRET_ACCESS_KEY_PRECISION}"
          OBS_ENDPOINT="obs.cn-southwest-2.myhuaweicloud.com"
          OBS_DEST="obs://sglang-npu/kernel/coverage/${{ matrix.chip }}"
          PACKAGE_DIR="$RUNNER_TEMP/kernel-deliverables"
          FILES=(source/baseline-source.tar.gz maps/test_case_map_${{ matrix.chip }}.json coverage/coverage-data.tar.gz)
          for file in "${FILES[@]}"; do
            test -s "$PACKAGE_DIR/$file"
          done
          if ! command -v obsutil >/dev/null 2>&1; then
            case "$(uname -m)" in
              aarch64|arm64) OBS_ARCH=arm64 ;;
              x86_64|amd64) OBS_ARCH=amd64 ;;
              *) echo "Unsupported obsutil architecture" >&2; exit 1 ;;
            esac
            curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors \
              "https://obs-community.obs.cn-north-1.myhuaweicloud.com/obsutil/current/obsutil_linux_${OBS_ARCH}.tar.gz" \
              -o "$RUNNER_TEMP/obsutil.tar.gz"
            mkdir -p "$RUNNER_TEMP/obsutil-extract" "$RUNNER_TEMP/obsutil-bin"
            tar -xzf "$RUNNER_TEMP/obsutil.tar.gz" -C "$RUNNER_TEMP/obsutil-extract"
            OBSUTIL="$(find "$RUNNER_TEMP/obsutil-extract" -type f -name obsutil -print -quit)"
            test -n "$OBSUTIL"
            install -m 0755 "$OBSUTIL" "$RUNNER_TEMP/obsutil-bin/obsutil"
            export PATH="$RUNNER_TEMP/obsutil-bin:$PATH"
          fi
          obsutil config -i="$OBS_ACCESS_KEY_ID" -k="$OBS_SECRET_ACCESS_KEY" -e="$OBS_ENDPOINT"
          for file in "${FILES[@]}"; do
            obsutil cp "$PACKAGE_DIR/$file" "$OBS_DEST/${file##*/}" -f -acl=public-read
          done
